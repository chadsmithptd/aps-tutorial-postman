<!DOCTYPE html>
<!--
  Scheduling UI Prototype — office/planner dashboard for realtime shop-floor awareness.

  KNOWN LIMITATIONS (this is an early prototype, not the real build):
    - Everything is in-memory. Refreshing the page resets all state.
    - The "floor activity" feed is a simulated/mocked event generator, not real
      speech-to-text. Voice summaries are represented as pre-written text templates.
    - Backward scheduling is per-job, infinite-capacity: each job's routing steps get
      target dates counting back from its own due date. Cross-job machine contention
      is flagged as a warning only — nothing is auto-rescheduled to resolve it.
    - No backend, no persistence, no auth.

  Open this file directly in a browser (double-click / file://) — no build step,
  no server, no external dependencies. Everything is self-contained below.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Floor Scheduling — Prototype</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --danger: #f85149;
    --warning: #d29922;
    --success: #3fb950;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px;
  }
  .app{height:100vh;display:flex;flex-direction:column;}

  /* ---------- header ---------- */
  header.toolbar{
    display:flex;align-items:center;gap:16px;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  header.toolbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em;}
  header.toolbar .clock{color:var(--muted);font-variant-numeric:tabular-nums;}
  .spacer{flex:1;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 10px;border-radius:999px;font-size:11px;
    border:1px solid var(--border);color:var(--muted);
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
  .pill.live .dot{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  button{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:.5;cursor:default;}
  button:disabled:hover{border-color:var(--border);}
  .count-badge{
    display:inline-block;min-width:18px;text-align:center;padding:1px 6px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-size:11px;
  }

  /* ---------- tab bar ---------- */
  nav.tabbar{display:flex;gap:4px;padding:8px 16px 0;background:var(--bg);flex-shrink:0;}
  .tab-btn{
    background:transparent;border:1px solid transparent;border-bottom:none;color:var(--muted);
    padding:8px 14px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer;
  }
  .tab-btn.active{background:var(--panel);color:var(--text);border-color:var(--border);}
  .hidden{display:none !important;}

  /* ---------- board layout ---------- */
  .board{
    flex:1;display:grid;grid-template-columns:1fr 340px;gap:12px;
    padding:12px;overflow:hidden;min-height:0;
  }
  .queue-col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden;}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .panel-header{
    display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);flex-shrink:0;
  }
  .panel-header .title{color:var(--text);font-weight:600;letter-spacing:.02em;}
  .panel-header .toggle{margin-left:auto;cursor:pointer;user-select:none;color:var(--muted);}
  .panel-header .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

  #queuePanel{flex:1 1 60%;min-height:0;}
  #blockedPanel{flex:0 0 auto;max-height:38%;}
  #blockedPanel.collapsed .card-list{display:none;}
  #blockedPanel.collapsed{max-height:none;}

  .card-list{
    flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;
    min-height:48px;
  }
  .card-list.empty::after{
    content:attr(data-empty-label);color:var(--muted);font-size:12px;padding:10px;text-align:center;
  }
  .card-list.dragging-over{background:rgba(88,166,255,.08);outline:1px dashed var(--accent);outline-offset:-4px;}

  /* ---------- job card / op row (shared) ---------- */
  .job-card{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;cursor:grab;position:relative;
  }
  .job-card.dragging{opacity:.35;}
  .job-card.flash{animation:flashHi 1.2s ease;}
  @keyframes flashHi{0%{box-shadow:0 0 0 2px var(--accent);}100%{box-shadow:0 0 0 0 transparent;}}
  .card-top{display:flex;align-items:center;gap:8px;}
  .rank-badge{
    flex-shrink:0;width:26px;height:26px;border-radius:6px;background:#0d1117;
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;
  }
  .card-main{flex:1;min-width:0;}
  .card-title{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
  .card-title .jid{color:var(--accent);font-weight:700;cursor:pointer;}
  .card-title .jid:hover{text-decoration:underline;}
  .card-sub{color:var(--muted);font-size:11px;margin-top:1px;}
  .rec-diff{font-size:10px;color:var(--warning);margin-left:auto;flex-shrink:0;white-space:nowrap;}
  .info-btn{
    flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-size:10px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .info-btn:hover{border-color:var(--accent);color:var(--accent);}

  .urgency-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .urgency-track{flex:1;height:5px;background:#0d1117;border-radius:3px;overflow:hidden;}
  .urgency-fill{height:100%;border-radius:3px;}
  .due-label{font-size:10.5px;color:var(--muted);white-space:nowrap;}

  .badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .badge{
    font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);
    display:inline-flex;align-items:center;gap:4px;color:var(--muted);
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;}
  .badge.risk{color:var(--warning);border-color:var(--warning);}
  .badge.late{color:var(--danger);border-color:var(--danger);}
  .badge.blocked-reason{color:var(--danger);border-color:var(--danger);}

  .breakdown{
    display:none;margin-top:8px;padding:8px;border-top:1px dashed var(--border);
    font-size:11px;color:var(--muted);
  }
  .breakdown.show{display:block;}
  .breakdown div{display:flex;justify-content:space-between;padding:1px 0;gap:12px;}
  .breakdown b{color:var(--text);text-align:right;}

  .blocked-card-actions{margin-top:6px;display:flex;justify-content:flex-end;}
  .blocked-card-actions button{font-size:11px;padding:4px 8px;}

  /* status dot colors, shared */
  .status-running,.status-on-shift{background:var(--success);}
  .status-idle,.status-break{background:var(--warning);}
  .status-down,.status-out,.status-maintenance,.status-off-shift{background:var(--danger);}

  /* ---------- feed panel ---------- */
  aside.panel{overflow:hidden;}
  .feed-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .feed-entry{
    background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--muted);
    border-radius:4px;padding:6px 8px;font-size:11.5px;animation:slideIn .25s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .feed-entry.cat-material,.feed-entry.cat-delay{border-left-color:var(--danger);}
  .feed-entry.cat-labor{border-left-color:var(--warning);}
  .feed-entry.cat-machine{border-left-color:var(--danger);}
  .feed-entry.cat-speedup{border-left-color:var(--success);}
  .feed-entry.cat-info{border-left-color:var(--accent);}
  .feed-entry.cat-pullforward{border-left-color:var(--accent);}
  .feed-meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:10px;margin-bottom:3px;}
  .feed-cat{
    text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:9.5px;
  }
  .feed-entry.cat-material .feed-cat,.feed-entry.cat-delay .feed-cat{color:var(--danger);}
  .feed-entry.cat-labor .feed-cat{color:var(--warning);}
  .feed-entry.cat-machine .feed-cat{color:var(--danger);}
  .feed-entry.cat-speedup .feed-cat{color:var(--success);}
  .feed-entry.cat-info .feed-cat{color:var(--accent);}
  .feed-entry.cat-pullforward .feed-cat{color:var(--accent);}
  .job-pill{
    color:var(--accent);cursor:pointer;text-decoration:underline dotted;font-weight:600;
  }
  .feed-actions{margin-top:5px;display:flex;justify-content:flex-end;gap:6px;}
  .feed-actions button{font-size:10.5px;padding:3px 7px;}
  .applied-tag{font-size:10px;color:var(--success);}

  /* ---------- footer status strip ---------- */
  footer.status-strip{
    flex-shrink:0;display:flex;gap:18px;padding:8px 16px;background:var(--panel);
    border-top:1px solid var(--border);overflow-x:auto;
  }
  .strip-group{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .strip-group .label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-right:4px;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
    border:1px solid var(--border);font-size:11px;background:var(--panel-2);white-space:nowrap;
  }
  .chip .dot{width:6px;height:6px;border-radius:50%;}

  /* ---------- routing / operations tab ---------- */
  .routing-view{flex:1;display:flex;padding:12px;overflow:hidden;min-height:0;}
  .resource-board{flex:1;display:flex;gap:12px;overflow-x:auto;min-height:0;}
  .resource-col{flex:0 0 260px;min-height:0;}
  .running-row{
    padding:6px 10px;border-bottom:1px solid var(--border);font-size:10.5px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0;
  }
  .running-empty{color:var(--muted);}

  .pin-btn{
    flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-size:10px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .pin-btn.pinned{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.12);}
  .op-row.pinned{border-color:var(--accent);}
  .pinned-badge{color:var(--accent);}

  .pending-panel{border-top:1px solid var(--border);flex-shrink:0;}
  .pending-header{
    display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;user-select:none;
    font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  }
  .pending-header:hover{color:var(--text);}
  .pending-caret{display:inline-block;transition:transform .15s ease;}
  .pending-panel.collapsed .pending-caret{transform:rotate(-90deg);}
  .pending-panel.collapsed .pending-list{display:none;}
  .pending-list{max-height:160px;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:5px;}
  .pending-row{
    background:var(--panel-2);border:1px dashed var(--border);border-radius:6px;padding:6px 8px;font-size:11px;
  }
  .pending-title{font-weight:600;}
  .pending-title .jid{color:var(--accent);cursor:pointer;}
  .pending-title .jid:hover{text-decoration:underline;}
  .pending-sub{color:var(--muted);font-size:10.5px;margin-top:2px;}
  .pending-empty{color:var(--muted);font-size:11px;padding:6px 8px;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(1,4,9,.6);display:flex;align-items:center;
    justify-content:center;z-index:50;
  }
  .modal-box{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:16px;width:320px;
  }
  .modal-box h3{margin:0 0 4px;font-size:13px;}
  .modal-box p{margin:0 0 12px;color:var(--muted);font-size:12px;}
  .modal-options{display:flex;flex-direction:column;gap:6px;}
  .modal-options button{text-align:left;padding:8px 10px;}
  .modal-cancel{margin-top:12px;width:100%;}

  .modal-box.wide{width:min(760px,92vw);max-height:82vh;display:flex;flex-direction:column;}
  .routing-modal-header p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .routing-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-shrink:0;}
  .routing-toolbar input,.routing-toolbar select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;
    padding:6px 8px;font-size:12px;
  }
  .routing-toolbar input{flex:1;}
  .routing-table-wrap{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:6px;margin-bottom:12px;}
  .routing-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .routing-table thead th{
    position:sticky;top:0;background:var(--panel-2);text-align:left;padding:6px 8px;
    border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;
  }
  .routing-table td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .routing-table tr.contention{background:rgba(248,81,73,.08);}
  .empty-row{text-align:center;color:var(--muted);padding:16px;}
  .status-badge-done{color:var(--success);border-color:var(--success);}
  .status-badge-in-progress{color:var(--accent);border-color:var(--accent);}
  .status-badge-ready{color:var(--text);}
  .status-badge-blocked{color:var(--danger);border-color:var(--danger);}
  .status-badge-pending{color:var(--muted);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>
<div class="app">

  <header class="toolbar">
    <h1>Shop Floor Scheduling</h1>
    <span class="clock" id="clock">--:--:--</span>
    <span class="spacer"></span>
    <span class="pill"><span class="dot" style="background:var(--accent)"></span><span id="activeCount">0</span>&nbsp;active</span>
    <span class="pill"><span class="dot" style="background:var(--danger)"></span><span id="blockedCount">0</span>&nbsp;blocked</span>
    <span class="pill live"><span class="dot"></span>LIVE SIM</span>
    <button id="resetBtn" title="Discard manual reordering and re-sort by computed priority">Reset to recommended</button>
  </header>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="priority">Priority Queue</button>
    <button class="tab-btn" data-tab="routing">Routing / Operations</button>
  </nav>

  <main class="board" id="priorityView">
    <div class="queue-col">
      <section class="panel" id="queuePanel">
        <div class="panel-header">
          <span class="title">Active Priority Queue</span>
          <span class="count-badge" id="queueCountBadge">0</span>
        </div>
        <div class="card-list" id="queueList" data-empty-label="No active jobs"></div>
      </section>

      <section class="panel" id="blockedPanel">
        <div class="panel-header">
          <span class="title">Blocked / Waiting</span>
          <span class="count-badge" id="blockedCountBadge">0</span>
          <span class="toggle" id="blockedToggle">▾ collapse</span>
        </div>
        <div class="card-list" id="blockedList" data-empty-label="Drag a job here when it's blocked (material, outside processing, machine down…)"></div>
      </section>
    </div>

    <aside class="panel">
      <div class="panel-header">
        <span class="title">Floor Activity</span>
      </div>
      <div class="feed-list" id="feedList"></div>
    </aside>
  </main>

  <main class="routing-view hidden" id="routingView">
    <div class="resource-board" id="resourceBoard"></div>
  </main>

  <footer class="status-strip">
    <div class="strip-group"><span class="label">Machines</span><span id="machineStrip"></span></div>
    <div class="strip-group"><span class="label">Employees</span><span id="employeeStrip"></span></div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     DATA GENERATION
  ========================================================= */
  const PARTS = [
    "Bracket Assembly, LH","Bracket Assembly, RH","Drive Shaft Coupling","Housing, Gearbox",
    "Manifold Block","Spindle Adapter","Flange Plate","Pump Impeller","Valve Body",
    "Bearing Retainer","Mounting Plate","Shaft Collar","Support Bracket","Cover, Inspection",
    "Hydraulic Fitting","Sensor Bracket","Gasket Carrier","Idler Pulley","Frame Rail","Clamp Ring"
  ];
  const CUSTOMERS = ["Acme Robotics","Northfield Industrial","Vantage Aero","Bluewater Marine","Corsair Dynamics","Meridian Fab"];

  const MACHINES = [
    {id:"m1", name:"CNC-01", status:"running", downUntil:null},
    {id:"m2", name:"CNC-02", status:"running", downUntil:null},
    {id:"m3", name:"CNC-03", status:"idle", downUntil:null},
    {id:"m4", name:"Mill-01", status:"running", downUntil:null},
    {id:"m5", name:"Lathe-02", status:"idle", downUntil:null},
    {id:"m6", name:"Saw-01", status:"running", downUntil:null},
    {id:"m7", name:"Deburr-01", status:"idle", downUntil:null},
    {id:"m8", name:"Assembly-01", status:"running", downUntil:null},
    {id:"m9", name:"Inspection-01", status:"idle", downUntil:null},
    {id:"m10", name:"Outside-Plating", status:"running", downUntil:null},
  ];
  const EMPLOYEES = [
    {id:"e1", name:"T. Alvarez", status:"on-shift"},
    {id:"e2", name:"K. Nguyen", status:"on-shift"},
    {id:"e3", name:"R. Patel", status:"on-shift"},
    {id:"e4", name:"J. Okafor", status:"break"},
    {id:"e5", name:"M. Sorensen", status:"on-shift"},
    {id:"e6", name:"D. Wu", status:"off-shift"},
  ];

  const machinesById = Object.fromEntries(MACHINES.map(m=>[m.id,m]));
  const employeesById = Object.fromEntries(EMPLOYEES.map(e=>[e.id,e]));

  function rand(min,max){ return min + Math.random()*(max-min); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // Operation-type templates: which work centers can run each op type, and how
  // long each op typically takes. Used to build plausible shape->finish->ship
  // routings rather than random noise.
  const OP_TEMPLATES = {
    "Saw":             { pool:["m6"],                  range:[0.25, 1.5] },
    "CNC Mill":        { pool:["m1","m2","m3","m4"],   range:[0.5, 6] },
    "CNC Lathe":       { pool:["m5"],                  range:[0.5, 4] },
    "Deburr":          { pool:["m7"],                  range:[0.2, 1] },
    "Assembly":        { pool:["m8"],                  range:[0.5, 8] },
    "Packaging":       { pool:["m8"],                  range:[0.25, 1] },
    "Inspection":      { pool:["m9"],                  range:[0.2, 0.75] },
    "Outside Plating": { pool:["m10"],                 range:[24, 96] },
  };
  const EARLY_OPS = ["Saw","CNC Mill","CNC Lathe"];
  const MID_OPS = ["Deburr","Assembly","Outside Plating"];
  const LATE_OPS = ["Inspection","Packaging"];

  function pickOpType(frac){
    let pool;
    if(frac < 0.35) pool = EARLY_OPS.concat(Math.random()<0.2 ? MID_OPS : []);
    else if(frac < 0.8) pool = MID_OPS.concat(Math.random()<0.3 ? EARLY_OPS : [], Math.random()<0.2 ? LATE_OPS : []);
    else pool = LATE_OPS.concat(Math.random()<0.15 ? MID_OPS : []);
    return pick(pool);
  }

  function pickRoutingLength(){
    const r = Math.random();
    if(r < 0.65) return Math.floor(rand(3,15));     // 65%: short
    if(r < 0.92) return Math.floor(rand(15,45));     // 27%: medium
    if(r < 0.98) return Math.floor(rand(45,90));     // 6%: long
    return Math.floor(rand(90,160));                 // 2%: very long (the "hundreds" outliers)
  }

  function buildRouting(jobId, length){
    const steps = [];
    for(let i=0;i<length;i++){
      const frac = length<=1 ? 0 : i/(length-1);
      const opType = pickOpType(frac);
      const tmpl = OP_TEMPLATES[opType];
      steps.push({
        id: `${jobId}-${String(i+1).padStart(3,"0")}`,
        jobId, seq: i+1,
        opType, name: `${opType} — Op ${i+1}`,
        workCenter: pick(tmpl.pool),
        durationHours: rand(tmpl.range[0], tmpl.range[1]),
        status: "pending", blockedReason: null, contentionWarning:false, pinned:false,
        backwardStart: null, backwardFinish: null,
        actualStart: null, actualFinish: null,
        employee: null,
      });
    }
    return steps;
  }

  // Seed plausible in-flight progress so jobs don't all start at 0% on load:
  // pick a random "progress point", mark everything before it done (with
  // backdated actual timestamps), the step at that point ready/in-progress,
  // and leave the rest pending.
  function seedProgressState(steps){
    const progressPoint = Math.floor(rand(0, steps.length));
    let cursor = new Date(Date.now() - rand(6,240)*3600000);
    for(let i=0;i<progressPoint;i++){
      const op = steps[i];
      op.status = "done";
      op.actualStart = new Date(cursor);
      cursor = new Date(cursor.getTime() + op.durationHours*3600000);
      op.actualFinish = new Date(cursor);
      op.employee = pick(EMPLOYEES).id;
    }
    const current = steps[progressPoint];
    if(current){
      if(Math.random() < 0.3){
        current.status = "in-progress";
        current.actualStart = new Date(cursor);
        current.employee = pick(EMPLOYEES).id;
      } else {
        current.status = "ready";
      }
    }
  }

  const JOB_COUNT = 90;
  const jobs = [];
  for(let i=0;i<JOB_COUNT;i++){
    const id = "J-" + (4100 + i*7);
    const routing = buildRouting(id, pickRoutingLength());
    seedProgressState(routing);
    const totalRemainingHours = routing.filter(s=>s.status!=="done").reduce((sum,s)=>sum+s.durationHours,0);
    const dueDate = new Date(Date.now() + totalRemainingHours*rand(0.5,1.6)*3600000 + rand(-24,24)*3600000);
    const materialRisk = Math.random() < 0.12;
    jobs.push({
      id, part: PARTS[i % PARTS.length], customer: pick(CUSTOMERS),
      qty: Math.floor(rand(4,120)),
      dueDate, routing,
      materialRisk, materialRiskNote: materialRisk ? "Vendor confirmed tight ETA on raw stock." : null,
      blocked:false, blockedReason:null, blockedAt:null,
      computedRank:null, scoreBreakdown:null,
      currentOp:null, percentComplete:0, atRiskFlag:"on-track", projectedFinish:null,
      estRemainingHours: totalRemainingHours,
      history:[]
    });
  }
  const jobsById = Object.fromEntries(jobs.map(j=>[j.id,j]));
  const opsById = {};
  jobs.forEach(job => job.routing.forEach(op => { opsById[op.id] = op; }));

  /* =========================================================
     STATE
  ========================================================= */
  const state = {
    manualOrder: [],    // order of active (non-blocked) queue, source of truth for display
    blockedOrder: [],
    resourceOrder: {},  // one array of ready-op ids per machine id, source of truth for the Routing tab
    openBreakdowns: new Set(),
    draggedId: null,
    feed: [],
    activeTab: "priority",
  };

  /* =========================================================
     SCORING & SCHEDULING
  ========================================================= */
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function hoursUntil(date){ return (date.getTime() - Date.now()) / 3600000; }

  // Per-job, infinite-capacity backward pass: walk the routing in reverse from
  // the due date so each step gets a target start/finish. Completed steps
  // anchor the cursor (via their actual finish) but never get their historical
  // targets rewritten.
  function backwardScheduleJob(job){
    let cursor = job.dueDate;
    for(let i=job.routing.length-1;i>=0;i--){
      const op = job.routing[i];
      if(op.status === "done"){
        cursor = op.actualFinish || op.backwardFinish || cursor;
        continue;
      }
      op.backwardFinish = cursor;
      op.backwardStart = new Date(cursor.getTime() - op.durationHours*3600000);
      cursor = op.backwardStart;
    }
  }

  function recomputeReadiness(){
    jobs.forEach(job=>{
      job.routing.forEach((op,i)=>{
        if(op.status !== "pending") return;
        const prev = job.routing[i-1];
        if(i===0 || (prev && prev.status==="done")) op.status = "ready";
      });
    });
  }

  // Display-only warning: flags operations whose backward-computed windows
  // overlap another operation competing for the same machine. Never auto-resolved.
  function flagContention(){
    const byMachine = {};
    jobs.forEach(job=>job.routing.forEach(op=>{
      op.contentionWarning = false;
      if(op.status === "done") return;
      (byMachine[op.workCenter] ||= []).push(op);
    }));
    Object.values(byMachine).forEach(list=>{
      list.sort((a,b)=> a.backwardStart - b.backwardStart);
      for(let i=0;i<list.length-1;i++){
        if(list[i].backwardFinish > list[i+1].backwardStart){
          list[i].contentionWarning = true;
          list[i+1].contentionWarning = true;
        }
      }
    });
  }

  // "Behind pace" signal: how far in the past (negative) or future (positive)
  // is the required start of the next incomplete step, per its own backward schedule.
  function computeSlackHours(job){
    const nextOp = job.routing.find(op=>op.status!=="done");
    if(!nextOp) return hoursUntil(job.dueDate);
    return hoursUntil(nextOp.backwardStart);
  }

  function recomputeJobAggregates(job){
    const routing = job.routing;
    const currentIdx = routing.findIndex(op=>op.status==="ready"||op.status==="in-progress");
    job.currentOp = currentIdx === -1 ? null : routing[currentIdx];
    job.currentOpIndex = currentIdx === -1 ? null : currentIdx;
    const doneHours = routing.filter(op=>op.status==="done").reduce((s,op)=>s+op.durationHours,0);
    const totalHours = routing.reduce((s,op)=>s+op.durationHours,0);
    job.percentComplete = totalHours>0 ? clamp((doneHours/totalHours)*100,0,100) : 0;
    job.estRemainingHours = totalHours - doneHours;
    const lastOp = routing[routing.length-1];
    job.projectedFinish = lastOp ? lastOp.backwardFinish : job.dueDate;
    const paceSlip = computeSlackHours(job);
    job.atRiskFlag = paceSlip >= 0 ? "on-track" : (paceSlip > -8 ? "at-risk" : "late");
  }

  function computeScore(job){
    const op = job.currentOp;
    const machine = op ? machinesById[op.workCenter] : null;
    const employee = (op && op.employee) ? employeesById[op.employee] : null;
    const dueInHours = hoursUntil(job.dueDate);
    const slackHours = computeSlackHours(job);
    const urgencyScore = clamp(100 - (slackHours/240)*100, 0, 100);

    let machinePenalty = 0;
    if(machine){
      if(machine.status === "down") machinePenalty = 20;
      else if(machine.status === "maintenance") machinePenalty = 8;
    }
    let laborPenalty = 0;
    if(employee){
      if((employee.status === "off-shift" || employee.status === "out") && slackHours < 24) laborPenalty = 15;
      else if(employee.status === "break") laborPenalty = 5;
    }
    const materialPenalty = (job.materialRisk && !job.blocked) ? 25 : 0;

    const finalScore = clamp(urgencyScore + machinePenalty + laborPenalty + materialPenalty, 0, 999);
    return {
      daysToDue: dueInHours/24, slackHours, urgencyScore,
      machinePenalty, laborPenalty, materialPenalty, finalScore
    };
  }

  function recomputeAll(){
    recomputeReadiness();
    jobs.forEach(backwardScheduleJob);
    flagContention();
    jobs.forEach(recomputeJobAggregates);
    jobs.forEach(j => j.scoreBreakdown = computeScore(j));
    const active = jobs.filter(j=>!j.blocked)
      .slice()
      .sort((a,b)=> b.scoreBreakdown.finalScore - a.scoreBreakdown.finalScore
                 || a.dueDate - b.dueDate
                 || a.id.localeCompare(b.id));
    active.forEach((j,i)=> j.computedRank = i+1);
    jobs.filter(j=>j.blocked).forEach(j=>{ j.computedRank = active.length + 1; });
  }

  function urgencyColor(score){
    if(score >= 70) return "var(--danger)";
    if(score >= 40) return "var(--warning)";
    return "var(--success)";
  }
  function fmtDue(date){
    const h = hoursUntil(date);
    const abs = date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
    if(h < 0) return `Overdue — was ${abs}`;
    if(h < 24) return `Due today, ${abs}`;
    return `Due ${abs} (${Math.round(h/24)}d)`;
  }
  function fmtDateTime(date){
    if(!date) return "—";
    return date.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
  }

  /* =========================================================
     RENDERING — Priority Queue tab
  ========================================================= */
  const queueListEl = document.getElementById("queueList");
  const blockedListEl = document.getElementById("blockedList");
  const feedListEl = document.getElementById("feedList");

  function cardInnerHTML(job, displayRank){
    const sb = job.scoreBreakdown;
    const color = urgencyColor(sb.finalScore);
    const op = job.currentOp;
    const machine = op ? machinesById[op.workCenter] : null;
    const employee = (op && op.employee) ? employeesById[op.employee] : null;
    const recDiff = (!job.blocked && displayRank !== job.computedRank)
      ? `<span class="rec-diff">recommended #${job.computedRank}</span>` : "";

    let badges = "";
    if(machine) badges += `<span class="badge"><span class="dot status-${machine.status}"></span>${machine.name}</span>`;
    if(employee) badges += `<span class="badge"><span class="dot status-${employee.status}"></span>${employee.name}</span>`;
    if(op) badges += `<span class="badge">Op ${op.seq}/${job.routing.length} · ${op.opType}</span>`;
    if(job.materialRisk && !job.blocked) badges += `<span class="badge risk">⚠ material risk</span>`;
    if(job.blocked) badges += `<span class="badge blocked-reason">${job.blockedReason}</span>`;

    let riskLabel = "";
    if(job.atRiskFlag === "late") riskLabel = `<span class="badge late">⚠ behind pace</span>`;
    else if(job.atRiskFlag === "at-risk") riskLabel = `<span class="badge risk">⚠ at risk</span>`;

    const blockedActions = job.blocked
      ? `<div class="blocked-card-actions"><button data-action="unblock" data-job="${job.id}">Return to queue</button></div>`
      : "";

    return `
      <div class="card-top">
        <div class="rank-badge">${displayRank}</div>
        <div class="card-main">
          <div class="card-title"><span class="jid" data-action="open-routing" data-job="${job.id}">${job.id}</span>${job.part}${recDiff}</div>
          <div class="card-sub">${job.customer} · qty ${job.qty} · ${job.percentComplete.toFixed(0)}% complete</div>
        </div>
        <button class="info-btn" data-action="toggle-info" data-job="${job.id}" title="Show score breakdown">i</button>
      </div>
      <div class="urgency-row">
        <div class="urgency-track"><div class="urgency-fill" style="width:${sb.finalScore}%;background:${color}"></div></div>
        <div class="due-label">${fmtDue(job.dueDate)}</div>
      </div>
      <div class="badge-row">${badges}${riskLabel}</div>
      ${blockedActions}
      <div class="breakdown${state.openBreakdowns.has(job.id) ? " show":""}">
        <div><span>Days to due</span><b>${sb.daysToDue.toFixed(1)}</b></div>
        <div><span>Pace slack (h)</span><b>${sb.slackHours.toFixed(1)}</b></div>
        <div><span>Urgency score</span><b>${sb.urgencyScore.toFixed(0)}</b></div>
        <div><span>Machine penalty</span><b>+${sb.machinePenalty}</b></div>
        <div><span>Labor penalty</span><b>+${sb.laborPenalty}</b></div>
        <div><span>Material penalty</span><b>+${sb.materialPenalty}</b></div>
        <div><span>Final score</span><b>${sb.finalScore.toFixed(0)}</b></div>
        <div><span>Current step</span><b>${op ? `Op ${op.seq} — ${op.opType}` : "—"}</b></div>
        <div><span>Routing length</span><b>${job.routing.length} steps</b></div>
        <div><span>Projected finish</span><b>${fmtDateTime(job.projectedFinish)}</b></div>
      </div>
    `;
  }

  function makeCardEl(job, displayRank){
    const el = document.createElement("div");
    el.className = "job-card drag-item";
    el.draggable = true;
    el.dataset.dragId = job.id;
    el.dataset.jobId = job.id;
    el.innerHTML = cardInnerHTML(job, displayRank);
    el.addEventListener("dragstart", onCardDragStart);
    el.addEventListener("dragend", onCardDragEnd);
    return el;
  }

  function renderQueue(){
    queueListEl.innerHTML = "";
    state.manualOrder.forEach((id, idx) => {
      const job = jobsById[id];
      if(!job || job.blocked) return;
      queueListEl.appendChild(makeCardEl(job, idx+1));
    });
    queueListEl.classList.toggle("empty", state.manualOrder.length === 0);
    document.getElementById("queueCountBadge").textContent = state.manualOrder.length;
    document.getElementById("activeCount").textContent = state.manualOrder.length;
  }

  function renderBlocked(){
    blockedListEl.innerHTML = "";
    state.blockedOrder.forEach((id, idx) => {
      const job = jobsById[id];
      if(!job || !job.blocked) return;
      blockedListEl.appendChild(makeCardEl(job, idx+1));
    });
    blockedListEl.classList.toggle("empty", state.blockedOrder.length === 0);
    document.getElementById("blockedCountBadge").textContent = state.blockedOrder.length;
    document.getElementById("blockedCount").textContent = state.blockedOrder.length;
  }

  function renderStrips(){
    const machineStrip = document.getElementById("machineStrip");
    machineStrip.innerHTML = MACHINES.map(m =>
      `<span class="chip"><span class="dot status-${m.status}"></span>${m.name} — ${m.status}</span>`
    ).join(" ");
    const employeeStrip = document.getElementById("employeeStrip");
    employeeStrip.innerHTML = EMPLOYEES.map(e =>
      `<span class="chip"><span class="dot status-${e.status}"></span>${e.name} — ${e.status}</span>`
    ).join(" ");
  }

  function sortManualOrderByRecommended(){
    state.manualOrder = jobs.filter(j=>!j.blocked)
      .slice()
      .sort((a,b)=> a.computedRank - b.computedRank)
      .map(j=>j.id);
  }

  /* =========================================================
     RENDERING — Routing / Operations tab
  ========================================================= */
  function initResourceOrder(){
    MACHINES.forEach(m => { state.resourceOrder[m.id] = []; });
    jobs.forEach(job=>{
      const op = job.currentOp;
      if(job.blocked || !op || op.status !== "ready") return;
      state.resourceOrder[op.workCenter].push(op.id);
    });
    Object.keys(state.resourceOrder).forEach(mid=>{
      state.resourceOrder[mid].sort((a,b)=> opsById[a].backwardStart - opsById[b].backwardStart);
    });
  }

  function removeJobOpFromResourceOrder(job){
    const op = job.currentOp;
    if(!op) return;
    const arr = state.resourceOrder[op.workCenter];
    if(!arr) return;
    const i = arr.indexOf(op.id);
    if(i > -1) arr.splice(i,1);
  }

  function addJobOpToResourceOrder(job){
    const op = job.currentOp;
    if(!op || op.status !== "ready") return;
    const arr = state.resourceOrder[op.workCenter];
    if(!arr || arr.includes(op.id)) return;
    let idx = arr.findIndex(id => opsById[id].backwardStart > op.backwardStart);
    if(idx === -1) idx = arr.length;
    arr.splice(idx, 0, op.id);
  }

  function buildResourceBoardSkeleton(){
    const board = document.getElementById("resourceBoard");
    MACHINES.forEach(m=>{
      const col = document.createElement("section");
      col.className = "panel resource-col";
      col.innerHTML = `
        <div class="panel-header">
          <span class="dot status-${m.status}" id="resDot-${m.id}"></span>
          <span class="title">${m.name}</span>
          <span class="count-badge" id="resCount-${m.id}">0</span>
        </div>
        <div class="running-row" id="running-${m.id}"></div>
        <div class="card-list op-list" id="opList-${m.id}" data-empty-label="No ready operations"></div>
        <div class="pending-panel collapsed" id="pendingPanel-${m.id}">
          <div class="pending-header" data-toggle-pending="${m.id}">
            <span class="pending-caret">▾</span> Waiting on predecessor
            <span class="count-badge" id="pendingCount-${m.id}">0</span>
          </div>
          <div class="pending-list" id="pendingList-${m.id}"></div>
        </div>
      `;
      board.appendChild(col);
      const listEl = col.querySelector(".op-list");
      // Drop target for both in-column reorder and cross-column reassignment
      // (dragging an operation onto a different machine's column re-assigns its
      // work center, if that machine is a valid alternate for its op type).
      wireDropZone(listEl, () => {
        const newIds = [...listEl.querySelectorAll(".drag-item")].map(el=>el.dataset.dragId);
        for(const opId of newIds){
          const op = opsById[opId];
          if(op.workCenter !== m.id && !OP_TEMPLATES[op.opType].pool.includes(m.id)){
            renderResourceBoard(); // not a valid work center for this op type — snap back
            return;
          }
        }
        newIds.forEach(opId => {
          const op = opsById[opId];
          if(op.workCenter !== m.id){
            const oldArr = state.resourceOrder[op.workCenter];
            const oldIdx = oldArr ? oldArr.indexOf(op.id) : -1;
            if(oldIdx > -1) oldArr.splice(oldIdx,1);
            op.workCenter = m.id;
          }
        });
        state.resourceOrder[m.id] = newIds;
        recomputeAll();
        renderQueue();
        renderStrips();
        renderResourceBoard();
      });
    });
    board.addEventListener("click", e => {
      const header = e.target.closest("[data-toggle-pending]");
      if(header){
        document.getElementById(`pendingPanel-${header.dataset.togglePending}`).classList.toggle("collapsed");
      }
    });
  }

  function opRowInnerHTML(op, displayIdx, recommendedRank){
    const job = jobsById[op.jobId];
    const diffBadge = op.pinned
      ? `<span class="rec-diff pinned-badge">📌 pinned</span>`
      : (recommendedRank !== displayIdx ? `<span class="rec-diff">recommended #${recommendedRank}</span>` : "");
    const contention = op.contentionWarning ? `<span class="badge risk">⚠ contention</span>` : "";
    return `
      <div class="card-top">
        <div class="rank-badge">${displayIdx}</div>
        <div class="card-main">
          <div class="card-title"><span class="jid" data-action="open-routing" data-job="${job.id}">${job.id}</span>${op.opType} · Op ${op.seq}/${job.routing.length}${diffBadge}</div>
          <div class="card-sub">${job.part} · ${op.durationHours.toFixed(1)}h</div>
        </div>
        <button class="pin-btn ${op.pinned?"pinned":""}" data-action="toggle-pin" data-op="${op.id}" title="${op.pinned?"Unpin":"Pin to top"}">📌</button>
      </div>
      <div class="urgency-row">
        <div class="due-label">Target start ${fmtDateTime(op.backwardStart)}</div>
      </div>
      <div class="badge-row">${contention}</div>
    `;
  }

  function makeOpRowEl(op, displayIdx, recommendedRank){
    const el = document.createElement("div");
    el.className = `job-card drag-item op-row${op.pinned ? " pinned" : ""}`;
    el.dataset.dragId = op.id;
    el.dataset.opId = op.id;
    el.dataset.jobId = op.jobId;
    el.innerHTML = opRowInnerHTML(op, displayIdx, recommendedRank);
    if(!op.pinned){
      el.draggable = true;
      el.addEventListener("dragstart", onCardDragStart);
      el.addEventListener("dragend", onCardDragEnd);
    }
    return el;
  }

  function renderResourceBoard(){
    // Lookahead: for each job, the step immediately after its current one is the
    // thing "waiting on predecessor" for whichever machine it's destined for.
    const waitingByMachine = {};
    MACHINES.forEach(m => { waitingByMachine[m.id] = []; });
    jobs.forEach(job=>{
      if(job.blocked || job.currentOpIndex == null) return;
      const nextOp = job.routing[job.currentOpIndex + 1];
      if(nextOp && nextOp.status === "pending" && waitingByMachine[nextOp.workCenter]){
        waitingByMachine[nextOp.workCenter].push({job, nextOp});
      }
    });

    MACHINES.forEach(m=>{
      const runningJobs = jobs.filter(j=>!j.blocked && j.currentOp && j.currentOp.status==="in-progress" && j.currentOp.workCenter===m.id);
      const runningRowEl = document.getElementById(`running-${m.id}`);
      if(runningRowEl){
        runningRowEl.innerHTML = runningJobs.length
          ? runningJobs.map(j=>`<span class="chip"><span class="dot status-running"></span>${j.id} · Op ${j.currentOp.seq}</span>`).join("")
          : `<span class="running-empty">Idle</span>`;
      }
      const listEl = document.getElementById(`opList-${m.id}`);
      if(listEl){
        listEl.innerHTML = "";
        const ids = state.resourceOrder[m.id] || [];
        const pinnedIds = ids.filter(id => opsById[id] && opsById[id].pinned);
        const unpinnedIds = ids.filter(id => opsById[id] && !opsById[id].pinned);
        const recRank = {};
        unpinnedIds.slice().sort((a,b)=>opsById[a].backwardStart-opsById[b].backwardStart).forEach((id,i)=>{ recRank[id] = i+1; });
        [...pinnedIds, ...unpinnedIds].forEach((opId, idx) => {
          const op = opsById[opId];
          if(!op) return;
          listEl.appendChild(makeOpRowEl(op, idx+1, recRank[opId]));
        });
        listEl.classList.toggle("empty", ids.length===0);
        const countEl = document.getElementById(`resCount-${m.id}`);
        if(countEl) countEl.textContent = ids.length;
      }
      const dotEl = document.getElementById(`resDot-${m.id}`);
      if(dotEl) dotEl.className = `dot status-${m.status}`;

      const waitingItems = waitingByMachine[m.id];
      const pendingListEl = document.getElementById(`pendingList-${m.id}`);
      if(pendingListEl){
        pendingListEl.innerHTML = waitingItems.length ? waitingItems.map(({job,nextOp}) => `
          <div class="pending-row">
            <div class="pending-title"><span class="jid" data-action="open-routing" data-job="${job.id}">${job.id}</span> ${nextOp.opType} · Op ${nextOp.seq}/${job.routing.length}</div>
            <div class="pending-sub">Waiting on Op ${job.currentOp.seq} (${job.currentOp.opType}, ${machinesById[job.currentOp.workCenter]?.name || job.currentOp.workCenter}) — ${job.currentOp.status}</div>
          </div>
        `).join("") : `<div class="pending-empty">Nothing queued behind current work</div>`;
      }
      const pendingCountEl = document.getElementById(`pendingCount-${m.id}`);
      if(pendingCountEl) pendingCountEl.textContent = waitingItems.length;
    });
  }

  function renderAll(){
    recomputeAll();
    sortManualOrderByRecommended();
    initResourceOrder();
    renderQueue();
    renderBlocked();
    renderStrips();
    renderResourceBoard();
  }

  /* =========================================================
     TAB SWITCHING
  ========================================================= */
  function showTab(name){
    state.activeTab = name;
    document.getElementById("priorityView").classList.toggle("hidden", name !== "priority");
    document.getElementById("routingView").classList.toggle("hidden", name !== "routing");
    document.querySelectorAll(".tab-btn").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.tab === name);
    });
  }
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", () => showTab(btn.dataset.tab));
  });

  /* =========================================================
     DRAG AND DROP (native HTML5 DnD, no external libraries)
  ========================================================= */
  function onCardDragStart(e){
    state.draggedId = e.currentTarget.dataset.dragId;
    e.currentTarget.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", state.draggedId);
  }
  function onCardDragEnd(e){
    e.currentTarget.classList.remove("dragging");
  }

  function getDragAfterElement(container, y){
    const els = [...container.querySelectorAll(".drag-item:not(.dragging)")];
    return els.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset){
        return {offset, element: child};
      }
      return closest;
    }, {offset:-Infinity, element:null}).element;
  }

  function wireDropZone(container, onDrop){
    container.addEventListener("dragover", e => {
      e.preventDefault();
      const dragging = document.querySelector(".drag-item.dragging");
      if(!dragging) return;
      container.classList.add("dragging-over");
      const after = getDragAfterElement(container, e.clientY);
      if(after == null) container.appendChild(dragging);
      else container.insertBefore(dragging, after);
    });
    container.addEventListener("dragleave", e => {
      if(e.target === container) container.classList.remove("dragging-over");
    });
    container.addEventListener("drop", e => {
      e.preventDefault();
      container.classList.remove("dragging-over");
      onDrop();
    });
  }

  function syncManualOrderFromDOM(){
    state.manualOrder = [...queueListEl.querySelectorAll(".job-card")].map(el => el.dataset.dragId);
  }
  function syncBlockedOrderFromDOM(){
    state.blockedOrder = [...blockedListEl.querySelectorAll(".job-card")].map(el => el.dataset.dragId);
  }

  wireDropZone(queueListEl, () => {
    const job = jobsById[state.draggedId];
    if(!job) return;
    const wasBlocked = job.blocked;
    const oldIndex = state.manualOrder.indexOf(job.id);
    if(job.blocked){
      job.blocked = false; job.blockedReason = null; job.blockedAt = null;
      job.history.push({ts:new Date(), actor:"planner", note:"Returned to active queue"});
      addJobOpToResourceOrder(job);
    }
    syncManualOrderFromDOM();
    syncBlockedOrderFromDOM();
    if(!wasBlocked){
      const newIndex = state.manualOrder.indexOf(job.id);
      if(oldIndex !== -1 && newIndex !== -1 && newIndex !== oldIndex){
        applyPriorityCascade(job, newIndex < oldIndex ? "up" : "down");
      }
    }
    recomputeAll();
    renderQueue();
    renderBlocked();
    renderStrips();
    renderResourceBoard();
  });

  // Cascade a manual priority-queue reorder down to the operations level: moving
  // a job up pins its current (ready) operation to the front of its machine's
  // column; moving it down releases that pin, letting normal urgency ordering resume.
  function applyPriorityCascade(job, direction){
    const op = job.currentOp;
    if(!op) return;
    if(direction === "up"){
      if(op.status !== "ready") return;
      op.pinned = true;
      const arr = state.resourceOrder[op.workCenter];
      if(arr){
        const idx = arr.indexOf(op.id);
        if(idx > -1){ arr.splice(idx,1); arr.unshift(op.id); }
      }
    } else {
      op.pinned = false;
    }
  }

  wireDropZone(blockedListEl, () => {
    const job = jobsById[state.draggedId];
    if(!job) return;
    if(job.blocked){
      syncBlockedOrderFromDOM();
      return;
    }
    openBlockReasonModal(job, (reason) => {
      blockJob(job, reason, "Manually blocked by planner");
      syncManualOrderFromDOM();
      syncBlockedOrderFromDOM();
      recomputeAll();
      renderQueue();
      renderBlocked();
      renderStrips();
      renderResourceBoard();
    }, () => {
      // cancelled: snap back to model (job stays active, in its old spot)
      renderQueue();
      renderBlocked();
    });
  });

  function blockJob(job, reason, note){
    job.blocked = true;
    job.blockedReason = reason;
    job.blockedAt = new Date();
    job.history.push({ts:new Date(), actor:"planner", note: note || `Blocked: ${reason}`});
    const idx = state.manualOrder.indexOf(job.id);
    if(idx !== -1) state.manualOrder.splice(idx,1);
    if(!state.blockedOrder.includes(job.id)) state.blockedOrder.push(job.id);
    removeJobOpFromResourceOrder(job);
  }

  function reinsertActive(job){
    job.scoreBreakdown = computeScore(job);
    let idx = state.manualOrder.findIndex(id => jobsById[id].scoreBreakdown.finalScore <= job.scoreBreakdown.finalScore);
    if(idx === -1) idx = state.manualOrder.length;
    state.manualOrder.splice(idx, 0, job.id);
  }

  /* click delegation: info toggle + return-to-queue button */
  document.getElementById("queuePanel").addEventListener("click", handleCardClick);
  document.getElementById("blockedPanel").addEventListener("click", handleCardClick);
  function handleCardClick(e){
    const infoBtn = e.target.closest("[data-action='toggle-info']");
    if(infoBtn){
      const id = infoBtn.dataset.job;
      if(state.openBreakdowns.has(id)) state.openBreakdowns.delete(id);
      else state.openBreakdowns.add(id);
      const card = infoBtn.closest(".job-card");
      card.querySelector(".breakdown").classList.toggle("show");
      return;
    }
    const unblockBtn = e.target.closest("[data-action='unblock']");
    if(unblockBtn){
      const job = jobsById[unblockBtn.dataset.job];
      const bIdx = state.blockedOrder.indexOf(job.id);
      if(bIdx !== -1) state.blockedOrder.splice(bIdx,1);
      job.blocked = false; job.blockedReason = null; job.blockedAt = null;
      job.history.push({ts:new Date(), actor:"planner", note:"Returned to active queue"});
      addJobOpToResourceOrder(job);
      recomputeAll();
      reinsertActive(job);
      renderQueue();
      renderBlocked();
      renderStrips();
      renderResourceBoard();
    }
  }

  /* click delegation: open a job's full routing detail (works from either tab) */
  document.addEventListener("click", e => {
    const openBtn = e.target.closest("[data-action='open-routing']");
    if(openBtn){
      const job = jobsById[openBtn.dataset.job];
      if(job) openJobRoutingModal(job);
      return;
    }
    const pinBtn = e.target.closest("[data-action='toggle-pin']");
    if(pinBtn){
      const op = opsById[pinBtn.dataset.op];
      if(op){
        op.pinned = !op.pinned;
        renderResourceBoard();
      }
    }
  });

  /* =========================================================
     BLOCK-REASON MODAL
  ========================================================= */
  const REASONS = [
    {key:"material", label:"Material — waiting on stock/vendor"},
    {key:"outside-processing", label:"Outside processing — sent out"},
    {key:"machine-down", label:"Machine down / unavailable"},
    {key:"other", label:"Other"},
  ];
  function openBlockReasonModal(job, onConfirm, onCancel){
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>Move ${job.id} to Blocked</h3>
        <p>Why is this job being held?</p>
        <div class="modal-options">
          ${REASONS.map(r => `<button data-reason="${r.key}">${r.label}</button>`).join("")}
        </div>
        <button class="modal-cancel">Cancel</button>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", e => {
      const reasonBtn = e.target.closest("[data-reason]");
      if(reasonBtn){
        document.body.removeChild(overlay);
        onConfirm(reasonBtn.dataset.reason);
        return;
      }
      if(e.target.classList.contains("modal-cancel") || e.target === overlay){
        document.body.removeChild(overlay);
        onCancel();
      }
    });
  }

  /* =========================================================
     JOB ROUTING DRILL-IN MODAL
  ========================================================= */
  function openJobRoutingModal(job){
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const riskBadge = job.atRiskFlag === "on-track" ? "" : `<span class="badge ${job.atRiskFlag==="late"?"late":"risk"}">${job.atRiskFlag}</span>`;
    overlay.innerHTML = `
      <div class="modal-box wide">
        <div class="routing-modal-header">
          <h3>${job.id} — ${job.part}</h3>
          <p>${job.customer} · ${fmtDue(job.dueDate)} · ${job.percentComplete.toFixed(0)}% complete ${riskBadge}</p>
        </div>
        <div class="routing-toolbar">
          <input type="text" id="routingSearch" placeholder="Search operations…">
          <select id="routingStatusFilter">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="ready">Ready</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
        <div class="routing-table-wrap">
          <table class="routing-table">
            <thead>
              <tr><th>Seq</th><th>Operation</th><th>Work Center</th><th>Duration</th><th>Target Start</th><th>Target Finish</th><th>Status</th></tr>
            </thead>
            <tbody id="routingTableBody"></tbody>
          </table>
        </div>
        <button class="modal-cancel">Close</button>
      </div>
    `;
    document.body.appendChild(overlay);

    function renderRows(){
      const q = overlay.querySelector("#routingSearch").value.toLowerCase();
      const statusFilter = overlay.querySelector("#routingStatusFilter").value;
      const tbody = overlay.querySelector("#routingTableBody");
      const rows = job.routing.filter(op => {
        if(statusFilter !== "all" && op.status !== statusFilter) return false;
        if(q && !`${op.opType} ${machinesById[op.workCenter]?.name||""}`.toLowerCase().includes(q)) return false;
        return true;
      });
      tbody.innerHTML = rows.length ? rows.map(op => `
        <tr class="${op.contentionWarning ? "contention":""}">
          <td>${op.seq}</td>
          <td>${op.opType}${op.contentionWarning ? ' ⚠':""}</td>
          <td>${machinesById[op.workCenter]?.name || op.workCenter}</td>
          <td>${op.durationHours.toFixed(2)}h</td>
          <td>${fmtDateTime(op.backwardStart)}</td>
          <td>${fmtDateTime(op.backwardFinish)}</td>
          <td><span class="badge status-badge-${op.status}">${op.status}</span></td>
        </tr>
      `).join("") : `<tr><td colspan="7" class="empty-row">No operations match</td></tr>`;
    }
    renderRows();
    overlay.querySelector("#routingSearch").addEventListener("input", renderRows);
    overlay.querySelector("#routingStatusFilter").addEventListener("change", renderRows);

    overlay.addEventListener("click", e => {
      if(e.target.classList.contains("modal-cancel") || e.target === overlay){
        document.body.removeChild(overlay);
      }
    });
  }

  /* =========================================================
     RESET TO RECOMMENDED
  ========================================================= */
  document.getElementById("resetBtn").addEventListener("click", () => {
    recomputeAll();
    sortManualOrderByRecommended();
    renderQueue();
    renderResourceBoard();
  });

  /* =========================================================
     BLOCKED PANEL COLLAPSE
  ========================================================= */
  document.getElementById("blockedToggle").addEventListener("click", () => {
    const panel = document.getElementById("blockedPanel");
    const collapsed = panel.classList.toggle("collapsed");
    document.getElementById("blockedToggle").textContent = collapsed ? "▸ expand" : "▾ collapse";
  });

  /* =========================================================
     FLOOR ACTIVITY FEED (simulated realtime engine)
  ========================================================= */
  const MAX_FEED_ENTRIES = 200;
  let feedSeq = 0;

  function activeJobPool(){ return jobs.filter(j => !j.blocked); }

  const EVENT_BUILDERS = [
    {
      category: "material",
      build(){
        const pool = activeJobPool();
        if(!pool.length) return null;
        const job = pick(pool);
        const days = Math.floor(rand(1,4));
        return {
          jobId: job.id,
          text: `Voice note from receiving: material delay reported for <b>${job.part}</b> (${job.id}) — vendor ETA slipped ${days} day${days>1?"s":""}.`,
          suggestion: {label:"Move to Blocked", applied:false, apply(){
            blockJob(job, "material", "Material delay reported via floor update");
          }}
        };
      }
    },
    {
      category: "labor",
      build(){
        const pool = activeJobPool().filter(j=>j.currentOp && j.currentOp.employee);
        if(!pool.length) return null;
        const job = pick(pool);
        const employee = employeesById[job.currentOp.employee];
        return {
          jobId: job.id,
          text: `${employee.name} called out sick — coverage needed for ${job.id} (Op ${job.currentOp.seq}).`,
          autoApply(){ employee.status = "out"; }
        };
      }
    },
    {
      category: "speedup",
      build(){
        const pool = activeJobPool().filter(j=>j.currentOp && j.currentOp.status==="in-progress");
        if(!pool.length) return null;
        const job = pick(pool);
        const op = job.currentOp;
        return {
          jobId: job.id,
          text: `Operator finished ${op.opType} early on ${job.id} (Op ${op.seq}) — remaining time trimmed.`,
          autoApply(){ op.durationHours = Math.max(0.25, op.durationHours * 0.6); }
        };
      }
    },
    {
      category: "machine",
      build(){
        const machine = pick(MACHINES);
        return {
          jobId: null,
          text: `${machine.name} flagged down for unplanned maintenance.`,
          autoApply(){ machine.status = "down"; machine.downUntil = new Date(Date.now()+2*3600000); }
        };
      }
    },
    {
      category: "pullforward",
      build(){
        const candidates = [];
        MACHINES.forEach(m=>{
          const arr = state.resourceOrder[m.id] || [];
          arr.slice(1).forEach(opId => candidates.push({machine:m, opId}));
        });
        if(!candidates.length) return null;
        const choice = pick(candidates);
        const op = opsById[choice.opId];
        const job = jobsById[op.jobId];
        return {
          jobId: job.id,
          text: `${choice.machine.name} will free up soon — Op ${op.seq} of ${job.id} is ready and could jump the queue.`,
          suggestion: {label:"Pull forward", applied:false, apply(){
            const arr = state.resourceOrder[choice.machine.id];
            const idx = arr.indexOf(op.id);
            if(idx > -1){ arr.splice(idx,1); arr.unshift(op.id); }
          }}
        };
      }
    },
    {
      category: "info",
      build(){
        const pool = jobs.filter(j=>!j.blocked);
        if(!pool.length) return null;
        const job = pick(pool);
        return { jobId: job.id, text: `QA sign-off complete on ${job.id}.` };
      }
    },
  ];

  function generateFloorEvent(){
    const builder = pick(EVENT_BUILDERS);
    const payload = builder.build();
    if(!payload) return;

    if(payload.autoApply) payload.autoApply();

    const entry = {
      id: "ev" + (++feedSeq),
      ts: new Date(),
      category: builder.category,
      jobId: payload.jobId,
      text: payload.text,
      suggestion: payload.suggestion || null,
    };
    state.feed.push(entry);
    if(state.feed.length > MAX_FEED_ENTRIES) state.feed.shift();
    appendFeedEntry(entry);

    if(payload.autoApply){
      recomputeAll();
      renderQueue();
      renderStrips();
      renderResourceBoard();
    }
  }

  function appendFeedEntry(entry){
    const el = document.createElement("div");
    el.className = `feed-entry cat-${entry.category}`;
    el.dataset.entryId = entry.id;
    const time = entry.ts.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const jobPill = entry.jobId ? `<span class="job-pill" data-goto="${entry.jobId}">${entry.jobId}</span>` : "";
    let actions = "";
    if(entry.suggestion){
      actions = `<div class="feed-actions" data-entry="${entry.id}">
        <button data-apply="${entry.id}">${entry.suggestion.label}</button>
      </div>`;
    }
    el.innerHTML = `
      <div class="feed-meta"><span class="feed-cat">${entry.category}</span><span>${time}</span>${jobPill}</div>
      <div>${entry.text}</div>
      ${actions}
    `;
    feedListEl.appendChild(el);
    while(feedListEl.children.length > MAX_FEED_ENTRIES) feedListEl.removeChild(feedListEl.firstChild);
    feedListEl.scrollTop = feedListEl.scrollHeight;
  }

  feedListEl.addEventListener("click", e => {
    const gotoEl = e.target.closest("[data-goto]");
    if(gotoEl){ highlightJob(gotoEl.dataset.goto); return; }
    const applyBtn = e.target.closest("[data-apply]");
    if(applyBtn){
      const entry = state.feed.find(f => f.id === applyBtn.dataset.apply);
      if(!entry || !entry.suggestion || entry.suggestion.applied) return;
      entry.suggestion.applied = true;
      entry.suggestion.apply();
      recomputeAll();
      renderQueue();
      renderBlocked();
      renderStrips();
      renderResourceBoard();
      const actionsEl = applyBtn.closest(".feed-actions");
      actionsEl.innerHTML = `<span class="applied-tag">✓ applied</span>`;
    }
  });

  function highlightJob(jobId){
    if(state.activeTab !== "priority") showTab("priority");
    const card = document.querySelector(`#queuePanel .job-card[data-job-id="${jobId}"], #blockedPanel .job-card[data-job-id="${jobId}"]`);
    if(!card) return;
    card.scrollIntoView({behavior:"smooth", block:"center"});
    card.classList.remove("flash");
    void card.offsetWidth; // restart animation
    card.classList.add("flash");
  }

  /* =========================================================
     TIMERS: clock, periodic recompute, jittered event stream
  ========================================================= */
  function tickClock(){
    document.getElementById("clock").textContent = new Date().toLocaleTimeString();
  }
  setInterval(tickClock, 1000);
  tickClock();

  // Periodic recompute: updates scores/urgency/badges without touching manualOrder
  // or resourceOrder, so a planner's manual reordering survives (only numbers/colors refresh).
  setInterval(() => {
    recomputeAll();
    renderQueue();
    renderBlocked();
    renderStrips();
    renderResourceBoard();
  }, 30000);

  function scheduleNextEvent(){
    const delay = rand(4000, 9000);
    setTimeout(() => {
      generateFloorEvent();
      scheduleNextEvent();
    }, delay);
  }
  scheduleNextEvent();

  /* =========================================================
     INIT
  ========================================================= */
  buildResourceBoardSkeleton();
  renderAll();
})();
</script>
</body>
</html>
