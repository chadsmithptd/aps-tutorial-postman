<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Floor Tracker</title>
<style>
:root {
  --bg: #0e1116;
  --panel: #171b22;
  --panel-alt: #1c212b;
  --border: #2a303c;
  --text: #e6e8eb;
  --text-dim: #8b94a3;
  --accent: #3ba7f2;
  --status-pending: #5a6472;
  --status-inprogress: #4caf6d;
  --status-paused: #e0a83f;
  --status-complete: #3ba7f2;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", "Consolas", "Roboto Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; }
button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.02em; }
.topbar-meta { display: flex; gap: 24px; align-items: center; font-size: 0.85rem; color: var(--text-dim); }
.topbar-meta strong { color: var(--text); }
.topbar-clock { font-family: var(--font-mono); font-size: 1rem; color: var(--text); min-width: 90px; text-align: right; }

.main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow-y: auto; }
.screen { display: none; flex: 1; flex-direction: column; gap: 20px; min-height: 0; }
.screen.active { display: flex; }

.picker-section h2 {
  font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 12px;
}
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.tile {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 18px 14px; min-height: 44px; color: var(--text); text-align: left;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.tile:hover { border-color: var(--accent); }
.tile.selected { border-color: var(--accent); background: var(--panel-alt); box-shadow: inset 0 0 0 1px var(--accent); }
.tile-number { font-family: var(--font-mono); color: var(--text-dim); font-size: 0.85rem; }
.tile-label { font-size: 1.05rem; font-weight: 600; }
.picker-actions { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
.btn-primary {
  background: var(--accent); border: none; color: #05131f; font-weight: 700;
  padding: 14px 28px; border-radius: 6px; font-size: 1rem; min-height: 44px;
}
.btn-primary:disabled { background: var(--status-pending); color: var(--text-dim); }
.btn-secondary {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 12px 20px; border-radius: 6px; min-height: 44px; font-size: 0.95rem;
}
.btn-secondary:hover { border-color: var(--accent); }
.resume-banner {
  background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
}

.list-summary { color: var(--text-dim); font-size: 0.9rem; }
.task-row-list { display: flex; flex-direction: column; gap: 10px; }
.task-row {
  display: grid; grid-template-columns: 48px 1fr auto auto; align-items: center; gap: 16px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 18px; min-height: 44px; text-align: left; color: var(--text); width: 100%;
}
.task-row:hover { border-color: var(--accent); }
.task-row-number { font-family: var(--font-mono); font-size: 1.4rem; color: var(--text-dim); }
.task-row-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.task-row-name { font-weight: 600; font-size: 1rem; }
.task-row-sub { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; }
.badge-segment { background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border); }
.badge-status { color: #05131f; }
.badge-status.pending { background: var(--status-pending); color: var(--text); }
.badge-status.in-progress { background: var(--status-inprogress); }
.badge-status.paused { background: var(--status-paused); }
.badge-status.complete { background: var(--status-complete); }
.task-row-time { font-family: var(--font-mono); text-align: right; font-size: 0.95rem; color: var(--text-dim); white-space: nowrap; }
.task-row-time strong { color: var(--text); }

.detail-layout { flex: 1; display: grid; grid-template-columns: 1fr 280px; gap: 20px; min-height: 0; }
.detail-main {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px;
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
}
.detail-op-number { font-family: var(--font-mono); color: var(--text-dim); font-size: 1rem; }
.detail-name { font-size: 1.6rem; font-weight: 700; margin: 0; }
.detail-category { color: var(--accent); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.detail-description { color: var(--text-dim); line-height: 1.5; max-width: 60ch; }
.detail-sidebar { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; overflow: hidden; }
.parts-list { flex: 1; overflow-y: auto; }
.parts-list-header { padding: 14px 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.part-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.part-row:last-child { border-bottom: none; }
.part-qty { color: var(--text-dim); font-family: var(--font-mono); }
.sidebar-tabs { width: 44px; border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 4px; }
.sidebar-tab { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-dim); background: transparent; border: none; font-size: 1.1rem; }
.sidebar-tab.active { background: var(--panel-alt); color: var(--text); }

.control-bar {
  background: var(--panel); border-top: 1px solid var(--border); padding: 16px 24px;
  display: flex; align-items: center; gap: 24px; flex-shrink: 0;
}
.control-step { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
.control-status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-pending); }
.status-dot.in-progress { background: var(--status-inprogress); }
.status-dot.paused { background: var(--status-paused); }
.status-dot.complete { background: var(--status-complete); }
.control-readout { display: flex; align-items: baseline; gap: 8px; }
.control-elapsed { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; }
.control-target { display: flex; flex-direction: column; gap: 2px; color: var(--text-dim); font-size: 0.8rem; }
.control-target strong { font-family: var(--font-mono); font-size: 1.1rem; color: var(--text); }
.control-spacer { flex: 1; }
.btn-toggle { min-width: 120px; min-height: 44px; border-radius: 6px; font-weight: 700; font-size: 1rem; border: none; }
.btn-toggle.start { background: var(--status-inprogress); color: #05130a; }
.btn-toggle.pause { background: var(--status-paused); color: #201400; }
.btn-complete { min-height: 44px; border-radius: 6px; font-weight: 700; padding: 0 20px; background: var(--accent); color: #05131f; border: none; }
.btn-flag { min-width: 44px; min-height: 44px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-size: 1.1rem; }
.back-link { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; }
.back-link:hover { color: var(--text); }

@media (max-width: 900px) {
  .detail-layout { grid-template-columns: 1fr; }
  .detail-sidebar { order: 2; }
  .control-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">Shop Floor Tracker</div>
  <div class="topbar-meta">
    <span id="headerContext" style="display: none;">
      WORKSTATION: <strong id="workstationLabel">--</strong>&nbsp;&nbsp;OPERATOR: <strong id="operatorLabel">--</strong>
    </span>
    <span class="topbar-clock" id="clock">--:--:--</span>
  </div>
</header>

<main class="main">

  <!-- Picker screen -->
  <section class="screen active" id="screen-picker">
    <div class="resume-banner" id="resumeBanner" style="display: none;">
      <span id="resumeText"></span>
      <button class="btn-secondary" id="resumeBtn">Resume</button>
    </div>
    <section class="picker-section">
      <h2>Workstation</h2>
      <div class="tile-grid" id="workstationGrid"></div>
    </section>
    <section class="picker-section">
      <h2>Operator</h2>
      <div class="tile-grid" id="operatorGrid"></div>
    </section>
    <div class="picker-actions">
      <button class="btn-primary" id="startShiftBtn" disabled>Start Shift</button>
    </div>
  </section>

  <!-- Task list screen -->
  <section class="screen" id="screen-list">
    <button class="back-link" id="switchOperatorLink">&larr; Switch operator/workstation</button>
    <div class="list-summary" id="listSummary"></div>
    <div class="task-row-list" id="taskRowList"></div>
  </section>

  <!-- Task detail screen -->
  <section class="screen" id="screen-task" style="flex-direction: row;">
    <div class="detail-layout" style="flex: 1;">
      <div class="detail-main">
        <button class="back-link" id="backToListLink">&larr; Back to task list</button>
        <span class="detail-op-number" id="detailOpNumber"></span>
        <h1 class="detail-name" id="detailName"></h1>
        <span class="detail-category" id="detailCategory"></span>
        <span class="badge badge-segment" id="detailSegment" style="width: fit-content;"></span>
        <p class="detail-description" id="detailDescription"></p>
      </div>
      <div class="detail-sidebar">
        <div class="parts-list">
          <div class="parts-list-header">Parts / Materials</div>
          <div id="partsListBody"></div>
        </div>
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" title="Parts">&#9635;</button>
          <button class="sidebar-tab" title="History" disabled>&#8635;</button>
          <button class="sidebar-tab" title="Comments" disabled>&#128172;</button>
          <button class="sidebar-tab" title="Settings" disabled>&#9881;</button>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- Bottom control bar (only visible on task screen) -->
<footer class="control-bar" id="controlBar" style="display: none;">
  <div class="control-step">
    <span class="control-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">--</span>
    </span>
    <span id="stepLabel">Step --</span>
  </div>
  <div class="control-readout">
    <span class="control-elapsed" id="elapsedReadout">00:00</span>
  </div>
  <div class="control-target">
    TAKT
    <strong id="targetReadout">--</strong>
  </div>
  <div class="control-spacer"></div>
  <button class="btn-toggle start" id="toggleBtn">Start</button>
  <button class="btn-complete" id="completeBtn">Complete</button>
  <button class="btn-flag" title="Report issue" disabled>&#9873;</button>
</footer>

<script>
/* ---------------------------------------------------------------------
 * Seed data
 * ------------------------------------------------------------------- */
const SEED_DATA = {
  version: 1,
  WORKSTATIONS: [
    { id: "WS-A92", label: "A-92" },
    { id: "WS-B14", label: "B-14" },
    { id: "WS-C03", label: "C-03" },
  ],
  OPERATORS: [
    { id: "OP-001", name: "M. SMITH" },
    { id: "OP-002", name: "J. RIVERA" },
    { id: "OP-003", name: "A. CHEN" },
  ],
  PARTS: [
    { id: "PT-FUELLINE", name: "Fuel Line" },
    { id: "PT-NUTPLATE", name: "Nut Plates" },
    { id: "PT-ENGMOUNT", name: "Engine Mounts" },
    { id: "PT-BLASTSHIELD", name: "Blast Shields" },
    { id: "PT-WASHER", name: "Washers" },
    { id: "PT-VAPORTUBE", name: "Vaporizing Tube" },
    { id: "PT-NAS14N", name: "NAS-14N (Screw)" },
    { id: "PT-NAS15N", name: "NAS-15N (Screw)" },
    { id: "PT-SPAR", name: "Wing Spar" },
    { id: "PT-SKIN", name: "Skin Panel" },
    { id: "PT-RIVET", name: "Rivets" },
    { id: "PT-HINGE", name: "Control Surface Hinge" },
    { id: "PT-SEALANT", name: "Sealant Tube" },
    { id: "PT-INSPECTTAG", name: "Inspection Tag" },
  ],
  SEGMENTS: [
    { id: "SEG-WING", name: "Wing Assembly" },
    { id: "SEG-POWER", name: "Power System" },
    { id: "SEG-TAIL", name: "Tail Assembly" },
    { id: "SEG-PAYLOAD", name: "Payload Assembly" },
    { id: "SEG-ENGINE", name: "Engine Assembly" },
    { id: "SEG-LAUNCH", name: "Launch Interface" },
  ],
  TASKS: [
    { id: "TASK-001", operatorId: "OP-001", workstationId: "WS-A92", segmentId: "SEG-ENGINE", opNumber: "01", name: "Engine ASSY", category: "Parts Retrieval", description: "Retrieve and stage all engine assembly parts at the workstation.", targetSeconds: 420, order: 1, parts: [{ partId: "PT-ENGMOUNT", qty: 1 }, { partId: "PT-NAS14N", qty: 1 }] },
    { id: "TASK-002", operatorId: "OP-001", workstationId: "WS-A92", segmentId: "SEG-ENGINE", opNumber: "02", name: "Fixture Setup", category: "Frame Prep", description: "Set up the assembly fixture and align the frame for engine mounting.", targetSeconds: 420, order: 2, parts: [{ partId: "PT-WASHER", qty: 4 }, { partId: "PT-NAS15N", qty: 2 }] },
    { id: "TASK-003", operatorId: "OP-001", workstationId: "WS-A92", segmentId: "SEG-ENGINE", opNumber: "03", name: "Mount Install", category: "Assembly", description: "Install engine mounts and torque to spec.", targetSeconds: 420, order: 3, parts: [{ partId: "PT-ENGMOUNT", qty: 2 }, { partId: "PT-BLASTSHIELD", qty: 1 }] },
    { id: "TASK-004", operatorId: "OP-001", workstationId: "WS-A92", segmentId: "SEG-POWER", opNumber: "04", name: "Motor Wiring", category: "Electrical", description: "Route and connect motor wiring harness, secure with clips.", targetSeconds: 420, order: 4, parts: [{ partId: "PT-FUELLINE", qty: 1 }, { partId: "PT-VAPORTUBE", qty: 1 }] },
    { id: "TASK-005", operatorId: "OP-001", workstationId: "WS-A92", segmentId: "SEG-ENGINE", opNumber: "05", name: "Alignment Check", category: "Quality", description: "Verify engine alignment against jig tolerances and log readings.", targetSeconds: 300, order: 5, parts: [{ partId: "PT-INSPECTTAG", qty: 1 }] },
    { id: "TASK-006", operatorId: "OP-001", workstationId: "WS-A92", segmentId: "SEG-LAUNCH", opNumber: "06", name: "Final Inspection", category: "Quality", description: "Perform final visual and torque-stripe inspection before sign-off.", targetSeconds: 300, order: 6, parts: [{ partId: "PT-INSPECTTAG", qty: 1 }] },
    { id: "TASK-101", operatorId: "OP-002", workstationId: "WS-B14", segmentId: "SEG-WING", opNumber: "01", name: "Spar Prep", category: "Parts Retrieval", description: "Retrieve wing spar and inspect for shipping damage before staging.", targetSeconds: 360, order: 1, parts: [{ partId: "PT-SPAR", qty: 1 }] },
    { id: "TASK-102", operatorId: "OP-002", workstationId: "WS-B14", segmentId: "SEG-WING", opNumber: "02", name: "Skin Fitting", category: "Assembly", description: "Fit skin panels to the spar and clamp in position.", targetSeconds: 480, order: 2, parts: [{ partId: "PT-SKIN", qty: 2 }, { partId: "PT-SEALANT", qty: 1 }] },
    { id: "TASK-103", operatorId: "OP-002", workstationId: "WS-B14", segmentId: "SEG-WING", opNumber: "03", name: "Rivet Install", category: "Assembly", description: "Drill and set rivets along the skin-to-spar seam per pattern.", targetSeconds: 600, order: 3, parts: [{ partId: "PT-RIVET", qty: 24 }] },
    { id: "TASK-104", operatorId: "OP-002", workstationId: "WS-B14", segmentId: "SEG-TAIL", opNumber: "04", name: "Control Surface", category: "Assembly", description: "Install control surface hinges and check freedom of movement.", targetSeconds: 420, order: 4, parts: [{ partId: "PT-HINGE", qty: 2 }, { partId: "PT-NAS14N", qty: 4 }] },
    { id: "TASK-105", operatorId: "OP-002", workstationId: "WS-B14", segmentId: "SEG-WING", opNumber: "05", name: "Paint Prep", category: "Finishing", description: "Mask fasteners and clean surfaces in preparation for paint.", targetSeconds: 300, order: 5, parts: [{ partId: "PT-SEALANT", qty: 1 }] },
    { id: "TASK-106", operatorId: "OP-002", workstationId: "WS-B14", segmentId: "SEG-WING", opNumber: "06", name: "QA Check", category: "Quality", description: "Complete quality checklist and tag the assembly for hand-off.", targetSeconds: 300, order: 6, parts: [{ partId: "PT-INSPECTTAG", qty: 1 }] },
  ],
};

/* ---------------------------------------------------------------------
 * Storage helpers
 * ------------------------------------------------------------------- */
const STORAGE_KEYS = {
  seedVersion: "sft.seedVersion",
  tasks: "sft.tasks",
  currentOperatorId: "sft.currentOperatorId",
  currentWorkstationId: "sft.currentWorkstationId",
  activeTaskId: "sft.activeTaskId",
};

function ensureSeeded() {
  const storedVersion = localStorage.getItem(STORAGE_KEYS.seedVersion);
  const storedTasks = localStorage.getItem(STORAGE_KEYS.tasks);
  if (storedVersion !== String(SEED_DATA.version) || !storedTasks) {
    const liveTasks = SEED_DATA.TASKS.map((task) => ({
      ...task,
      status: "pending",
      accumulatedSeconds: 0,
      runningStartTs: null,
      completedAtTs: null,
      logEntries: [],
    }));
    localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(liveTasks));
    localStorage.setItem(STORAGE_KEYS.seedVersion, String(SEED_DATA.version));
  }
}

function getTasks() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks) || "[]"); }
function saveTasks(tasks) { localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks)); }
function getTasksForOperator(operatorId) {
  return getTasks().filter((t) => t.operatorId === operatorId).sort((a, b) => a.order - b.order);
}
function getTaskById(taskId) { return getTasks().find((t) => t.id === taskId) || null; }
function updateTask(updatedTask) {
  const tasks = getTasks();
  const index = tasks.findIndex((t) => t.id === updatedTask.id);
  if (index !== -1) { tasks[index] = updatedTask; saveTasks(tasks); }
}
function getCurrentOperatorId() { return localStorage.getItem(STORAGE_KEYS.currentOperatorId); }
function getCurrentWorkstationId() { return localStorage.getItem(STORAGE_KEYS.currentWorkstationId); }
function setCurrentSelection(operatorId, workstationId) {
  localStorage.setItem(STORAGE_KEYS.currentOperatorId, operatorId);
  localStorage.setItem(STORAGE_KEYS.currentWorkstationId, workstationId);
}
function getActiveTaskId() { return localStorage.getItem(STORAGE_KEYS.activeTaskId); }
function setActiveTaskId(taskId) { localStorage.setItem(STORAGE_KEYS.activeTaskId, taskId); }
function findOperator(id) { return SEED_DATA.OPERATORS.find((o) => o.id === id) || null; }
function findWorkstation(id) { return SEED_DATA.WORKSTATIONS.find((w) => w.id === id) || null; }
function findSegment(id) { return SEED_DATA.SEGMENTS.find((s) => s.id === id) || null; }
function findPart(id) { return SEED_DATA.PARTS.find((p) => p.id === id) || null; }

/* ---------------------------------------------------------------------
 * Timer logic
 * ------------------------------------------------------------------- */
function getElapsedSeconds(task) {
  const runningSeconds = task.runningStartTs ? Math.floor((Date.now() - task.runningStartTs) / 1000) : 0;
  return task.accumulatedSeconds + runningSeconds;
}
function startTask(task) {
  if (task.runningStartTs) return task;
  const tasks = getTasks();
  tasks.forEach((t) => {
    if (t.id !== task.id && t.operatorId === task.operatorId && t.runningStartTs) pauseTask(t);
  });
  task.status = "in-progress";
  task.runningStartTs = Date.now();
  task.logEntries.push({ startTs: task.runningStartTs, endTs: null, seconds: null });
  updateTask(task);
  return task;
}
function pauseTask(task) {
  if (!task.runningStartTs) return task;
  const now = Date.now();
  const elapsedThisRun = Math.floor((now - task.runningStartTs) / 1000);
  task.accumulatedSeconds += elapsedThisRun;
  task.status = "paused";
  const openEntry = task.logEntries[task.logEntries.length - 1];
  if (openEntry && openEntry.endTs === null) { openEntry.endTs = now; openEntry.seconds = elapsedThisRun; }
  task.runningStartTs = null;
  updateTask(task);
  return task;
}
function completeTask(task) {
  if (task.runningStartTs) task = pauseTask(task);
  task.status = "complete";
  task.completedAtTs = Date.now();
  updateTask(task);
  return task;
}
function formatHMS(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function formatMS(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, "0")}M:${String(s).padStart(2, "0")}S`;
}

/* ---------------------------------------------------------------------
 * View router (single page, no navigation/reload — state stays in JS
 * memory for "current screen" but all task/timer data lives in
 * localStorage so nothing is lost if the page is refreshed).
 * ------------------------------------------------------------------- */
let currentScreen = "picker";
let currentListOperatorId = null;
let currentTaskId = null;
let selectedWorkstationId = null;
let selectedOperatorId = null;

function showScreen(name) {
  currentScreen = name;
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  document.getElementById(`screen-${name}`).classList.add("active");
  document.getElementById("controlBar").style.display = name === "task" ? "flex" : "none";
  document.getElementById("headerContext").style.display = name === "picker" ? "none" : "inline";
}

function renderClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", { hour12: false });
}

function renderHeaderContext() {
  const operatorId = currentScreen === "task"
    ? (getTaskById(currentTaskId) || {}).operatorId
    : currentListOperatorId;
  const operator = findOperator(operatorId);
  const workstation = findWorkstation(getCurrentWorkstationId());
  document.getElementById("operatorLabel").textContent = operator ? operator.name : "--";
  document.getElementById("workstationLabel").textContent = workstation ? workstation.label : "--";
}

/* ---- Picker screen ---- */
function renderWorkstations() {
  const grid = document.getElementById("workstationGrid");
  grid.innerHTML = "";
  SEED_DATA.WORKSTATIONS.forEach((ws, index) => {
    const tile = document.createElement("button");
    tile.className = "tile" + (ws.id === selectedWorkstationId ? " selected" : "");
    tile.innerHTML = `<span class="tile-number">${String(index + 1).padStart(2, "0")}</span><span class="tile-label">${ws.label}</span>`;
    tile.addEventListener("click", () => { selectedWorkstationId = ws.id; renderWorkstations(); updateStartShiftButton(); });
    grid.appendChild(tile);
  });
}
function renderOperators() {
  const grid = document.getElementById("operatorGrid");
  grid.innerHTML = "";
  SEED_DATA.OPERATORS.forEach((op, index) => {
    const tile = document.createElement("button");
    tile.className = "tile" + (op.id === selectedOperatorId ? " selected" : "");
    tile.innerHTML = `<span class="tile-number">${String(index + 1).padStart(2, "0")}</span><span class="tile-label">${op.name}</span>`;
    tile.addEventListener("click", () => { selectedOperatorId = op.id; renderOperators(); updateStartShiftButton(); });
    grid.appendChild(tile);
  });
}
function updateStartShiftButton() {
  document.getElementById("startShiftBtn").disabled = !(selectedWorkstationId && selectedOperatorId);
}
function renderResumeBanner() {
  const priorOperatorId = getCurrentOperatorId();
  const priorWorkstationId = getCurrentWorkstationId();
  const banner = document.getElementById("resumeBanner");
  if (!priorOperatorId || !priorWorkstationId) { banner.style.display = "none"; return; }
  const operator = findOperator(priorOperatorId);
  const workstation = findWorkstation(priorWorkstationId);
  if (!operator || !workstation) { banner.style.display = "none"; return; }
  document.getElementById("resumeText").textContent = `Resume as ${operator.name} at ${workstation.label}`;
  banner.style.display = "flex";
}
document.getElementById("resumeBtn").addEventListener("click", () => {
  goToList(getCurrentOperatorId());
});
document.getElementById("startShiftBtn").addEventListener("click", () => {
  if (!selectedOperatorId || !selectedWorkstationId) return;
  setCurrentSelection(selectedOperatorId, selectedWorkstationId);
  goToList(selectedOperatorId);
});

/* ---- Task list screen ---- */
function goToList(operatorId) {
  currentListOperatorId = operatorId;
  showScreen("list");
  renderHeaderContext();
  renderTaskList();
}
function statusLabel(status) { return status.replace("-", " ").toUpperCase(); }
function renderTaskList() {
  const tasks = getTasksForOperator(currentListOperatorId);
  const container = document.getElementById("taskRowList");
  container.innerHTML = "";
  const completeCount = tasks.filter((t) => t.status === "complete").length;
  document.getElementById("listSummary").textContent = `${completeCount} of ${tasks.length} complete`;
  tasks.forEach((task) => {
    const segment = findSegment(task.segmentId);
    const elapsed = getElapsedSeconds(task);
    const row = document.createElement("button");
    row.className = "task-row";
    row.innerHTML = `
      <span class="task-row-number">${task.opNumber}</span>
      <span class="task-row-info">
        <span class="task-row-name">${task.name}</span>
        <span class="task-row-sub">
          <span>${task.category}</span>
          ${segment ? `<span class="badge badge-segment">${segment.name}</span>` : ""}
        </span>
      </span>
      <span class="badge badge-status ${task.status}">${statusLabel(task.status)}</span>
      <span class="task-row-time"><strong>${formatHMS(elapsed)}</strong> / ${formatMS(task.targetSeconds)}</span>
    `;
    row.addEventListener("click", () => goToTask(task.id));
    container.appendChild(row);
  });
}
document.getElementById("switchOperatorLink").addEventListener("click", () => {
  showScreen("picker");
  renderResumeBanner();
});

/* ---- Task detail screen ---- */
function goToTask(taskId) {
  currentTaskId = taskId;
  setActiveTaskId(taskId);
  showScreen("task");
  renderHeaderContext();
  renderTaskInfo();
  renderControlBar();
}
function renderTaskInfo() {
  const task = getTaskById(currentTaskId);
  const segment = findSegment(task.segmentId);
  document.getElementById("detailOpNumber").textContent = `OP ${task.opNumber}`;
  document.getElementById("detailName").textContent = task.name;
  document.getElementById("detailCategory").textContent = task.category;
  document.getElementById("detailDescription").textContent = task.description;
  const segmentEl = document.getElementById("detailSegment");
  if (segment) { segmentEl.textContent = segment.name; segmentEl.style.display = "inline-block"; }
  else { segmentEl.style.display = "none"; }
  const partsBody = document.getElementById("partsListBody");
  partsBody.innerHTML = "";
  (task.parts || []).forEach((entry) => {
    const part = findPart(entry.partId);
    const row = document.createElement("div");
    row.className = "part-row";
    row.innerHTML = `<span>${part ? part.name : entry.partId}</span><span class="part-qty">x${entry.qty}</span>`;
    partsBody.appendChild(row);
  });
}
function renderControlBar() {
  const task = getTaskById(currentTaskId);
  if (!task) return;
  const elapsed = getElapsedSeconds(task);
  document.getElementById("stepLabel").textContent = `Step ${task.opNumber}`;
  document.getElementById("statusText").textContent = task.status.replace("-", " ").toUpperCase();
  document.getElementById("statusDot").className = `status-dot ${task.status}`;
  document.getElementById("elapsedReadout").textContent = formatHMS(elapsed);
  document.getElementById("targetReadout").textContent = formatMS(task.targetSeconds);
  const toggleBtn = document.getElementById("toggleBtn");
  const completeBtn = document.getElementById("completeBtn");
  if (task.status === "complete") {
    toggleBtn.textContent = "Start"; toggleBtn.className = "btn-toggle start"; toggleBtn.disabled = true; completeBtn.disabled = true;
  } else if (task.status === "in-progress") {
    toggleBtn.textContent = "Pause"; toggleBtn.className = "btn-toggle pause"; toggleBtn.disabled = false; completeBtn.disabled = false;
  } else {
    toggleBtn.textContent = "Start"; toggleBtn.className = "btn-toggle start"; toggleBtn.disabled = false; completeBtn.disabled = false;
  }
}
document.getElementById("toggleBtn").addEventListener("click", () => {
  let task = getTaskById(currentTaskId);
  task = task.status === "in-progress" ? pauseTask(task) : startTask(task);
  renderControlBar();
});
document.getElementById("completeBtn").addEventListener("click", () => {
  completeTask(getTaskById(currentTaskId));
  renderControlBar();
});
document.getElementById("backToListLink").addEventListener("click", () => {
  const task = getTaskById(currentTaskId);
  goToList(task ? task.operatorId : currentListOperatorId);
});

/* ---------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------- */
ensureSeeded();
renderWorkstations();
renderOperators();
renderResumeBanner();
renderClock();
showScreen("picker");
setInterval(() => {
  renderClock();
  if (currentScreen === "list") renderTaskList();
  if (currentScreen === "task") renderControlBar();
}, 1000);
</script>
</body>
</html>
