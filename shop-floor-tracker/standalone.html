<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Floor Tracker</title>
<style>
:root {
  --bg: #0e1116;
  --panel: #171b22;
  --panel-alt: #1c212b;
  --border: #2a303c;
  --text: #e6e8eb;
  --text-dim: #8b94a3;
  --accent: #3ba7f2;
  --status-pending: #5a6472;
  --status-inprogress: #4caf6d;
  --status-paused: #e0a83f;
  --status-complete: #3ba7f2;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", "Consolas", "Roboto Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; }
button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.02em; }
.topbar-meta { display: flex; gap: 24px; align-items: center; font-size: 0.85rem; color: var(--text-dim); }
.topbar-meta strong { color: var(--text); }
.topbar-clock { font-family: var(--font-mono); font-size: 1rem; color: var(--text); min-width: 90px; text-align: right; }

.main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow-y: auto; }
.screen { display: none; flex: 1; flex-direction: column; gap: 20px; min-height: 0; }
.screen.active { display: flex; }

.picker-section h2 {
  font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 12px;
}
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.tile {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 18px 14px; min-height: 44px; color: var(--text); text-align: left;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.tile:hover { border-color: var(--accent); }
.tile.selected { border-color: var(--accent); background: var(--panel-alt); box-shadow: inset 0 0 0 1px var(--accent); }
.tile-number { font-family: var(--font-mono); color: var(--text-dim); font-size: 0.85rem; }
.tile-label { font-size: 1.05rem; font-weight: 600; }
.picker-actions { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
.btn-primary {
  background: var(--accent); border: none; color: #05131f; font-weight: 700;
  padding: 14px 28px; border-radius: 6px; font-size: 1rem; min-height: 44px;
}
.btn-primary:disabled { background: var(--status-pending); color: var(--text-dim); }
.btn-secondary {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 12px 20px; border-radius: 6px; min-height: 44px; font-size: 0.95rem;
}
.btn-secondary:hover { border-color: var(--accent); }
.resume-banner {
  background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
}

.search-input {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--text);
  font-size: 0.95rem;
  min-height: 44px;
  width: 100%;
  max-width: 480px;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--text-dim); }

.list-summary { color: var(--text-dim); font-size: 0.9rem; }
.job-row-list { display: flex; flex-direction: column; gap: 10px; }
.job-row {
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 16px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 18px; min-height: 44px; text-align: left; color: var(--text); width: 100%;
}
.job-row:hover { border-color: var(--accent); }
.job-row-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.job-row-name { font-weight: 600; font-size: 1rem; }
.job-row-sub { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 10px; flex-wrap: wrap; }
.job-row-progress { font-size: 0.85rem; color: var(--text-dim); white-space: nowrap; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; }
.badge-segment { background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border); }
.badge-status { color: #05131f; }
.badge-status.pending { background: var(--status-pending); color: var(--text); }
.badge-status.in-progress { background: var(--status-inprogress); }
.badge-status.paused { background: var(--status-paused); }
.badge-status.complete { background: var(--status-complete); }

.job-header { display: flex; flex-direction: column; gap: 4px; }
.job-header-name { font-size: 1.3rem; font-weight: 700; }
.job-header-sub { font-size: 0.85rem; color: var(--text-dim); }

.workspace-layout { flex: 1; display: grid; grid-template-columns: 260px 1fr 280px; gap: 20px; min-height: 0; }
.workspace-sidebar {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; overflow: hidden;
}
.workspace-sidebar-header {
  padding: 14px 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-dim); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.operation-row-list { overflow-y: auto; display: flex; flex-direction: column; }
.operation-row {
  display: flex; flex-direction: column; gap: 4px; align-items: stretch;
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  padding: 10px 16px; text-align: left; color: var(--text); width: 100%;
}
.operation-row:last-child { border-bottom: none; }
.operation-row:hover { background: var(--panel-alt); }
.operation-row.selected { background: var(--panel-alt); box-shadow: inset 2px 0 0 var(--accent); }
.operation-row-number { font-family: var(--font-mono); color: var(--text-dim); font-size: 0.8rem; }
.operation-row-info { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.operation-row-name { font-size: 0.9rem; font-weight: 600; }
.operation-row-time { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim); }

.workspace-main { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.workspace-parts {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; display: flex;
}

.detail-main {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px;
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
}
.detail-op-number { font-family: var(--font-mono); color: var(--text-dim); font-size: 1rem; }
.detail-name { font-size: 1.6rem; font-weight: 700; margin: 0; }
.detail-category { color: var(--accent); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.detail-description { color: var(--text-dim); line-height: 1.5; max-width: 60ch; }

.parts-list { flex: 1; overflow-y: auto; }
.parts-list-header {
  padding: 14px 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-dim); border-bottom: 1px solid var(--border);
}
.part-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
}
.part-row:last-child { border-bottom: none; }
.part-qty { color: var(--text-dim); font-family: var(--font-mono); }

.control-bar {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 24px;
  display: flex; align-items: center; gap: 24px; flex-shrink: 0;
}
.control-step { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
.control-status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-pending); }
.status-dot.in-progress { background: var(--status-inprogress); }
.status-dot.paused { background: var(--status-paused); }
.status-dot.complete { background: var(--status-complete); }
.control-readout { display: flex; align-items: baseline; gap: 8px; }
.control-elapsed { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; }
.control-target { display: flex; flex-direction: column; gap: 2px; color: var(--text-dim); font-size: 0.8rem; }
.control-target strong { font-family: var(--font-mono); font-size: 1.1rem; color: var(--text); }
.control-spacer { flex: 1; }
.btn-toggle { min-width: 120px; min-height: 44px; border-radius: 6px; font-weight: 700; font-size: 1rem; border: none; }
.btn-toggle.start { background: var(--status-inprogress); color: #05130a; }
.btn-toggle.pause { background: var(--status-paused); color: #201400; }
.btn-complete {
  min-height: 44px; border-radius: 6px; font-weight: 700; padding: 0 20px;
  background: var(--accent); color: #05131f; border: none;
}

.back-link {
  color: var(--text-dim); text-decoration: none; font-size: 0.85rem;
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0;
}
.back-link:hover { color: var(--text); }

@media (max-width: 900px) {
  .workspace-layout { grid-template-columns: 1fr; }
  .workspace-sidebar { order: 1; max-height: 240px; }
  .workspace-main { order: 2; }
  .workspace-parts { order: 3; }
  .control-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">Shop Floor Tracker</div>
  <div class="topbar-meta">
    <span id="headerContext" style="display: none;">
      WORKSTATION: <strong id="workstationLabel">--</strong>&nbsp;&nbsp;OPERATOR: <strong id="operatorLabel">--</strong>
    </span>
    <span class="topbar-clock" id="clock">--:--:--</span>
  </div>
</header>

<main class="main">

  <!-- Picker screen -->
  <section class="screen active" id="screen-picker">
    <div class="resume-banner" id="resumeBanner" style="display: none;">
      <span id="resumeText"></span>
      <button class="btn-secondary" id="resumeBtn">Resume</button>
    </div>
    <section class="picker-section">
      <h2>Workstation</h2>
      <div class="tile-grid" id="workstationGrid"></div>
    </section>
    <section class="picker-section">
      <h2>Operator</h2>
      <div class="tile-grid" id="operatorGrid"></div>
    </section>
    <div class="picker-actions">
      <button class="btn-primary" id="startShiftBtn" disabled>Start Shift</button>
    </div>
  </section>

  <!-- Jobs list screen -->
  <section class="screen" id="screen-list">
    <button class="back-link" id="switchOperatorLink">&larr; Switch operator/workstation</button>
    <input type="text" class="search-input" id="jobSearchInput" placeholder="Search jobs by name, work order, or product..." />
    <div class="list-summary" id="listSummary"></div>
    <div class="job-row-list" id="jobRowList"></div>
  </section>

  <!-- Job workspace screen -->
  <section class="screen" id="screen-job">
    <button class="back-link" id="backToListLink">&larr; Back to job list</button>
    <div class="job-header">
      <span class="job-header-name" id="jobHeaderName"></span>
      <span class="job-header-sub" id="jobHeaderSub"></span>
    </div>

    <div class="workspace-layout">
      <div class="workspace-sidebar">
        <div class="workspace-sidebar-header">Operations</div>
        <div class="operation-row-list" id="operationRowList"></div>
      </div>

      <div class="workspace-main">
        <div class="detail-main">
          <span class="detail-op-number" id="detailOpNumber"></span>
          <h1 class="detail-name" id="detailName"></h1>
          <span class="detail-category" id="detailCategory"></span>
          <span class="badge badge-segment" id="detailSegment" style="width: fit-content;"></span>
          <p class="detail-description" id="detailDescription"></p>
        </div>

        <div class="control-bar">
          <div class="control-step">
            <span class="control-status">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusText">--</span>
            </span>
            <span id="stepLabel">Step --</span>
          </div>
          <div class="control-readout">
            <span class="control-elapsed" id="elapsedReadout">00:00</span>
          </div>
          <div class="control-target">
            TAKT
            <strong id="targetReadout">--</strong>
          </div>
          <div class="control-spacer"></div>
          <button class="btn-toggle start" id="toggleBtn">Start</button>
          <button class="btn-complete" id="completeBtn">Complete</button>
        </div>
      </div>

      <div class="workspace-parts">
        <div class="parts-list">
          <div class="parts-list-header">Required Inputs</div>
          <div id="partsListBody"></div>
        </div>
      </div>
    </div>
  </section>

</main>

    { id: "TASK-503", jobId: "JOB-006", operatorId: "OP-003", workstationId: "WS-C03", segmentId: "SEG-LAUNCH", opNumber: "03", name: "Final Sign-off", category: "Quality", description: "Complete final QA checklist and tag the interface for hand-off.", targetSeconds: 240, order: 3, parts: [{ partId: "PT-INSPECTTAG", qty: 1 }] },

/* ---------------------------------------------------------------------
 * Storage helpers
 * ------------------------------------------------------------------- */
const STORAGE_KEYS = {
  seedVersion: "sft.seedVersion",
  operations: "sft.operations",
  currentOperatorId: "sft.currentOperatorId",
  currentWorkstationId: "sft.currentWorkstationId",
  activeJobId: "sft.activeJobId",
  activeOperationIdByJob: "sft.activeOperationIdByJob",
};

function ensureSeeded() {
  const storedVersion = localStorage.getItem(STORAGE_KEYS.seedVersion);
  const storedOperations = localStorage.getItem(STORAGE_KEYS.operations);
  if (storedVersion !== String(SEED_DATA.version) || !storedOperations) {
    const liveOperations = SEED_DATA.OPERATIONS.map((op) => ({
      ...op,
      status: "pending",
      accumulatedSeconds: 0,
      runningStartTs: null,
      completedAtTs: null,
      logEntries: [],
    }));
    localStorage.setItem(STORAGE_KEYS.operations, JSON.stringify(liveOperations));
    localStorage.setItem(STORAGE_KEYS.seedVersion, String(SEED_DATA.version));
  }
}

function getOperations() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.operations) || "[]"); }
function saveOperations(operations) { localStorage.setItem(STORAGE_KEYS.operations, JSON.stringify(operations)); }
function getOperationsForJob(jobId) {
  return getOperations().filter((o) => o.jobId === jobId).sort((a, b) => a.order - b.order);
}
function getOperationById(operationId) { return getOperations().find((o) => o.id === operationId) || null; }
function updateOperation(updatedOperation) {
  const operations = getOperations();
  const index = operations.findIndex((o) => o.id === updatedOperation.id);
  if (index !== -1) { operations[index] = updatedOperation; saveOperations(operations); }
}

function getJobs() { return SEED_DATA.JOBS.slice(); }
function getJobsForOperator(operatorId) {
  return getJobs().filter((j) => j.operatorId === operatorId).sort((a, b) => a.order - b.order);
}
function getJobById(jobId) { return SEED_DATA.JOBS.find((j) => j.id === jobId) || null; }
function getJobProgress(jobId) {
  const operations = getOperationsForJob(jobId);
  const total = operations.length;
  const completeCount = operations.filter((o) => o.status === "complete").length;
  const anyStarted = operations.some((o) => o.status === "in-progress" || o.status === "paused" || o.status === "complete");
  let aggregateStatus;
  if (total > 0 && completeCount === total) aggregateStatus = "complete";
  else if (anyStarted) aggregateStatus = "in-progress";
  else aggregateStatus = "pending";
  return { completeCount, total, aggregateStatus };
}

function getCurrentOperatorId() { return localStorage.getItem(STORAGE_KEYS.currentOperatorId); }
function getCurrentWorkstationId() { return localStorage.getItem(STORAGE_KEYS.currentWorkstationId); }
function setCurrentSelection(operatorId, workstationId) {
  localStorage.setItem(STORAGE_KEYS.currentOperatorId, operatorId);
  localStorage.setItem(STORAGE_KEYS.currentWorkstationId, workstationId);
}
function getActiveJobId() { return localStorage.getItem(STORAGE_KEYS.activeJobId); }
function setActiveJobId(jobId) { localStorage.setItem(STORAGE_KEYS.activeJobId, jobId); }
function getActiveOperationIdForJob(jobId) {
  const map = JSON.parse(localStorage.getItem(STORAGE_KEYS.activeOperationIdByJob) || "{}");
  return map[jobId] || null;
}
function setActiveOperationIdForJob(jobId, operationId) {
  const map = JSON.parse(localStorage.getItem(STORAGE_KEYS.activeOperationIdByJob) || "{}");
  map[jobId] = operationId;
  localStorage.setItem(STORAGE_KEYS.activeOperationIdByJob, JSON.stringify(map));
}

function findOperator(operatorId) { return SEED_DATA.OPERATORS.find((o) => o.id === operatorId) || null; }
function findWorkstation(workstationId) { return SEED_DATA.WORKSTATIONS.find((w) => w.id === workstationId) || null; }
function findSegment(segmentId) { return SEED_DATA.SEGMENTS.find((s) => s.id === segmentId) || null; }
function findPart(partId) { return SEED_DATA.PARTS.find((p) => p.id === partId) || null; }

/* ---------------------------------------------------------------------
 * Timer logic
 * ------------------------------------------------------------------- */
function getElapsedSeconds(operation) {
  const runningSeconds = operation.runningStartTs ? Math.floor((Date.now() - operation.runningStartTs) / 1000) : 0;
  return operation.accumulatedSeconds + runningSeconds;
}
function startOperation(operation) {
  if (operation.runningStartTs) return operation;
  const operations = getOperations();
  operations.forEach((o) => {
    if (o.id !== operation.id && o.operatorId === operation.operatorId && o.runningStartTs) pauseOperation(o);
  });
  operation.status = "in-progress";
  operation.runningStartTs = Date.now();
  operation.logEntries.push({ startTs: operation.runningStartTs, endTs: null, seconds: null });
  updateOperation(operation);
  return operation;
}
function pauseOperation(operation) {
  if (!operation.runningStartTs) return operation;
  const now = Date.now();
  const elapsedThisRun = Math.floor((now - operation.runningStartTs) / 1000);
  operation.accumulatedSeconds += elapsedThisRun;
  operation.status = "paused";
  const openEntry = operation.logEntries[operation.logEntries.length - 1];
  if (openEntry && openEntry.endTs === null) { openEntry.endTs = now; openEntry.seconds = elapsedThisRun; }
  operation.runningStartTs = null;
  updateOperation(operation);
  return operation;
}
function completeOperation(operation) {
  if (operation.runningStartTs) operation = pauseOperation(operation);
  operation.status = "complete";
  operation.completedAtTs = Date.now();
  updateOperation(operation);
  return operation;
}
function formatHMS(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function formatMS(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, "0")}M:${String(s).padStart(2, "0")}S`;
}

/* ---------------------------------------------------------------------
 * View router (single page, no navigation/reload — state stays in JS
 * memory for "current screen" but all job/operation/timer data lives in
 * localStorage so nothing is lost if the page is refreshed).
 * ------------------------------------------------------------------- */
let currentScreen = "picker";
let currentListOperatorId = null;
let currentJobId = null;
let currentOperationId = null;
let selectedWorkstationId = null;
let selectedOperatorId = null;
let searchTerm = "";

function showScreen(name) {
  currentScreen = name;
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  document.getElementById(`screen-${name}`).classList.add("active");
  document.getElementById("headerContext").style.display = name === "picker" ? "none" : "inline";
}

function renderClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", { hour12: false });
}

/* ---- Picker screen ---- */
function renderWorkstations() {
  const grid = document.getElementById("workstationGrid");
  grid.innerHTML = "";
  SEED_DATA.WORKSTATIONS.forEach((ws, index) => {
    const tile = document.createElement("button");
    tile.className = "tile" + (ws.id === selectedWorkstationId ? " selected" : "");
    tile.innerHTML = `<span class="tile-number">${String(index + 1).padStart(2, "0")}</span><span class="tile-label">${ws.label}</span>`;
    tile.addEventListener("click", () => { selectedWorkstationId = ws.id; renderWorkstations(); updateStartShiftButton(); });
    grid.appendChild(tile);
  });
}
function renderOperators() {
  const grid = document.getElementById("operatorGrid");
  grid.innerHTML = "";
  SEED_DATA.OPERATORS.forEach((op, index) => {
    const tile = document.createElement("button");
    tile.className = "tile" + (op.id === selectedOperatorId ? " selected" : "");
    tile.innerHTML = `<span class="tile-number">${String(index + 1).padStart(2, "0")}</span><span class="tile-label">${op.name}</span>`;
    tile.addEventListener("click", () => { selectedOperatorId = op.id; renderOperators(); updateStartShiftButton(); });
    grid.appendChild(tile);
  });
}
function updateStartShiftButton() {
  document.getElementById("startShiftBtn").disabled = !(selectedWorkstationId && selectedOperatorId);
}
function renderResumeBanner() {
  const priorOperatorId = getCurrentOperatorId();
  const priorWorkstationId = getCurrentWorkstationId();
  const banner = document.getElementById("resumeBanner");
  if (!priorOperatorId || !priorWorkstationId) { banner.style.display = "none"; return; }
  const operator = findOperator(priorOperatorId);
  const workstation = findWorkstation(priorWorkstationId);
  if (!operator || !workstation) { banner.style.display = "none"; return; }
  document.getElementById("resumeText").textContent = `Resume as ${operator.name} at ${workstation.label}`;
  banner.style.display = "flex";
}
document.getElementById("resumeBtn").addEventListener("click", () => {
  goToList(getCurrentOperatorId());
});
document.getElementById("startShiftBtn").addEventListener("click", () => {
  if (!selectedOperatorId || !selectedWorkstationId) return;
  setCurrentSelection(selectedOperatorId, selectedWorkstationId);
  goToList(selectedOperatorId);
});

/* ---- Jobs list screen ---- */
function goToList(operatorId) {
  currentListOperatorId = operatorId;
  searchTerm = "";
  document.getElementById("jobSearchInput").value = "";
  showScreen("list");
  renderListHeader();
  renderJobList();
}
function renderListHeader() {
  const operator = findOperator(currentListOperatorId);
  const workstation = findWorkstation(getCurrentWorkstationId());
  document.getElementById("operatorLabel").textContent = operator ? operator.name : "--";
  document.getElementById("workstationLabel").textContent = workstation ? workstation.label : "--";
}
function statusLabel(status) { return status.replace("-", " ").toUpperCase(); }
function matchesSearch(job) {
  if (!searchTerm) return true;
  const haystack = `${job.name} ${job.workOrderNo} ${job.productName}`.toLowerCase();
  return haystack.includes(searchTerm.toLowerCase());
}
function renderJobList() {
  const allJobs = getJobsForOperator(currentListOperatorId);
  const jobs = allJobs.filter(matchesSearch);
  const container = document.getElementById("jobRowList");
  container.innerHTML = "";

  const completeJobs = allJobs.filter((j) => getJobProgress(j.id).aggregateStatus === "complete").length;
  let summaryText = `${completeJobs} of ${allJobs.length} jobs complete`;
  if (searchTerm) summaryText += ` — showing ${jobs.length} match${jobs.length === 1 ? "" : "es"}`;
  document.getElementById("listSummary").textContent = summaryText;

  jobs.forEach((job) => {
    const progress = getJobProgress(job.id);
    const row = document.createElement("button");
    row.className = "job-row";
    row.innerHTML = `
      <span class="job-row-info">
        <span class="job-row-name">${job.name}</span>
        <span class="job-row-sub"><span>${job.workOrderNo}</span><span>${job.productName}</span></span>
      </span>
      <span class="job-row-progress">${progress.completeCount} of ${progress.total} operations complete</span>
      <span class="badge badge-status ${progress.aggregateStatus}">${statusLabel(progress.aggregateStatus)}</span>
    `;
    row.addEventListener("click", () => goToJob(job.id));
    container.appendChild(row);
  });
}
document.getElementById("jobSearchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  renderJobList();
});
document.getElementById("switchOperatorLink").addEventListener("click", () => {
  showScreen("picker");
  renderResumeBanner();
});

/* ---- Job workspace screen ---- */
function goToJob(jobId) {
  currentJobId = jobId;
  setActiveJobId(jobId);
  currentOperationId = pickInitialOperationId(jobId);
  showScreen("job");
  renderJobHeader();
  renderOperationList();
  renderMiddlePanel();
  renderPartsPanel();
}
function pickInitialOperationId(jobId) {
  const operations = getOperationsForJob(jobId);
  if (operations.length === 0) return null;
  const restored = getActiveOperationIdForJob(jobId);
  if (restored && operations.some((o) => o.id === restored)) return restored;
  const inProgress = operations.find((o) => o.status === "in-progress");
  if (inProgress) return inProgress.id;
  const notComplete = operations.find((o) => o.status !== "complete");
  if (notComplete) return notComplete.id;
  return operations[0].id;
}
function renderJobHeader() {
  const job = getJobById(currentJobId);
  const operator = findOperator(job.operatorId);
  const workstation = findWorkstation(job.workstationId);
  document.getElementById("operatorLabel").textContent = operator ? operator.name : "--";
  document.getElementById("workstationLabel").textContent = workstation ? workstation.label : "--";
  document.getElementById("jobHeaderName").textContent = job.name;
  document.getElementById("jobHeaderSub").textContent = `${job.workOrderNo} · ${job.productName}`;
}
function selectOperation(operationId) {
  currentOperationId = operationId;
  setActiveOperationIdForJob(currentJobId, operationId);
  renderOperationList();
  renderMiddlePanel();
  renderPartsPanel();
}
function renderOperationList() {
  const operations = getOperationsForJob(currentJobId);
  const container = document.getElementById("operationRowList");
  container.innerHTML = "";
  operations.forEach((op) => {
    const elapsed = getElapsedSeconds(op);
    const row = document.createElement("button");
    row.className = "operation-row" + (op.id === currentOperationId ? " selected" : "");
    row.innerHTML = `
      <span class="operation-row-number">${op.opNumber}</span>
      <span class="operation-row-info">
        <span class="operation-row-name">${op.name}</span>
        <span class="badge badge-status ${op.status}">${statusLabel(op.status)}</span>
      </span>
      <span class="operation-row-time">${formatHMS(elapsed)} / ${formatMS(op.targetSeconds)}</span>
    `;
    row.addEventListener("click", () => selectOperation(op.id));
    container.appendChild(row);
  });
}
function renderMiddlePanel() {
  const operation = getOperationById(currentOperationId);
  if (!operation) return;
  const segment = findSegment(operation.segmentId);
  document.getElementById("detailOpNumber").textContent = `OP ${operation.opNumber}`;
  document.getElementById("detailName").textContent = operation.name;
  document.getElementById("detailCategory").textContent = operation.category;
  document.getElementById("detailDescription").textContent = operation.description;

  const segmentEl = document.getElementById("detailSegment");
  if (segment) { segmentEl.textContent = segment.name; segmentEl.style.display = "inline-block"; }
  else { segmentEl.style.display = "none"; }

  const elapsed = getElapsedSeconds(operation);
  document.getElementById("stepLabel").textContent = `Step ${operation.opNumber}`;
  document.getElementById("statusText").textContent = statusLabel(operation.status);
  document.getElementById("statusDot").className = `status-dot ${operation.status}`;
  document.getElementById("elapsedReadout").textContent = formatHMS(elapsed);
  document.getElementById("targetReadout").textContent = formatMS(operation.targetSeconds);

  const toggleBtn = document.getElementById("toggleBtn");
  const completeBtn = document.getElementById("completeBtn");
  if (operation.status === "complete") {
    toggleBtn.textContent = "Start"; toggleBtn.className = "btn-toggle start"; toggleBtn.disabled = true; completeBtn.disabled = true;
  } else if (operation.status === "in-progress") {
    toggleBtn.textContent = "Pause"; toggleBtn.className = "btn-toggle pause"; toggleBtn.disabled = false; completeBtn.disabled = false;
  } else {
    toggleBtn.textContent = "Start"; toggleBtn.className = "btn-toggle start"; toggleBtn.disabled = false; completeBtn.disabled = false;
  }
}
function renderPartsPanel() {
  const operation = getOperationById(currentOperationId);
  const partsBody = document.getElementById("partsListBody");
  partsBody.innerHTML = "";
  if (!operation) return;
  (operation.parts || []).forEach((entry) => {
    const part = findPart(entry.partId);
    const row = document.createElement("div");
    row.className = "part-row";
    row.innerHTML = `<span>${part ? part.name : entry.partId}</span><span class="part-qty">x${entry.qty}</span>`;
    partsBody.appendChild(row);
  });
}
document.getElementById("toggleBtn").addEventListener("click", () => {
  const operation = getOperationById(currentOperationId);
  if (operation.status === "in-progress") pauseOperation(operation);
  else startOperation(operation);
  renderOperationList();
  renderMiddlePanel();
});
document.getElementById("completeBtn").addEventListener("click", () => {
  completeOperation(getOperationById(currentOperationId));
  renderOperationList();
  renderMiddlePanel();
});
document.getElementById("backToListLink").addEventListener("click", () => {
  const job = getJobById(currentJobId);
  goToList(job ? job.operatorId : currentListOperatorId);
});

/* ---------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------- */
ensureSeeded();
renderWorkstations();
renderOperators();
renderResumeBanner();
renderClock();
showScreen("picker");
setInterval(() => {
  renderClock();
  if (currentScreen === "list") renderJobList();
  if (currentScreen === "job") { renderOperationList(); renderMiddlePanel(); }
}, 1000);
</script>
